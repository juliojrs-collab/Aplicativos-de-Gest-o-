<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0c85aa"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>

<link rel="manifest" href="manifest.webmanifest"/>
<title>Entregas · Purific</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#f0f4f8;--surface:#fff;--surface2:#f7fafc;
  --blue:#0c85aa;--blue-light:#e6f4f8;--blue-dark:#08607b;
  --green:#0e9f6e;--green-light:#e6f6f0;
  --red:#e02424;--red-light:#fde8e8;
  --amber:#c27803;--amber-light:#fdf6b2;
  --text:#111827;--text2:#4b5563;--text3:#9ca3af;
  --border:#e5e7eb;--border2:#d1d5db;
  --r:12px;--r2:8px;
  --sh:0 1px 3px rgba(0,0,0,.08);--sh2:0 4px 16px rgba(0,0,0,.12);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.45;}
button{font:inherit;cursor:pointer;}
input,select,textarea{font:inherit;color:inherit;}
a{color:var(--blue);}
.top{position:sticky;top:0;z-index:20;background:var(--blue);color:#fff;box-shadow:var(--sh2);padding-top:env(safe-area-inset-top);}
.top-in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;}
.top h1{font-size:16px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.top .back{background:none;border:none;color:#fff;font-size:22px;line-height:1;padding:0 4px;}
.top .who{background:rgba(255,255,255,.18);border:none;color:#fff;border-radius:20px;padding:5px 10px;font-size:12px;font-weight:600;max-width:45vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
main{max-width:760px;margin:0 auto;padding:14px 14px 96px;}
.sub{color:var(--text2);font-size:12px;}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px;margin-bottom:12px;}
.card h3{font-size:14px;margin-bottom:10px;}
.btn{border:none;border-radius:var(--r2);padding:11px 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;}
.btn-p{background:var(--blue);color:#fff;}
.btn-g{background:var(--surface2);color:var(--text);border:1px solid var(--border2);}
.btn-ok{background:var(--green);color:#fff;}
.btn-sm{padding:6px 10px;font-size:12px;}
.btn-lg{padding:15px 18px;font-size:16px;width:100%;}
.btn:disabled{opacity:.55;cursor:not-allowed;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:4px;}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--border2);border-radius:var(--r2);padding:10px 12px;background:#fff;font-size:16px;}
.field textarea{resize:vertical;}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(12,133,170,.15);}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;}
@media(max-width:520px){.g2{grid-template-columns:1fr;}}
.req{color:var(--red);}
.hint{font-size:12px;color:var(--text3);margin-top:4px;}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;}
.chip{border:1px solid var(--border2);background:#fff;border-radius:20px;padding:7px 12px;font-size:13px;white-space:nowrap;font-weight:600;color:var(--text2);}
.opts{display:flex;flex-wrap:wrap;gap:6px;}
.opts .chip{white-space:normal;}
.chip:disabled{opacity:.6;}
.chip.on{border-color:var(--blue);background:var(--blue-light);color:var(--blue-dark);}
.search{width:100%;border:1px solid var(--border2);border-radius:var(--r2);padding:11px 12px;font-size:16px;margin-bottom:10px;background:#fff;}
.os{display:flex;gap:12px;align-items:flex-start;cursor:pointer;}
.os-num{font-weight:800;font-size:15px;min-width:58px;color:var(--blue-dark);}
.os-main{flex:1;min-width:0;}
.os-main .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.os-main .s{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px;}
.badge{display:inline-block;border-radius:20px;padding:3px 9px;font-size:11px;font-weight:700;white-space:nowrap;}
.b-blue{background:var(--blue-light);color:var(--blue-dark);}
.b-amber{background:var(--amber-light);color:var(--amber);}
.b-green{background:var(--green-light);color:var(--green);}
.b-red{background:var(--red-light);color:var(--red);}
.b-gray{background:#eef0f3;color:var(--text2);}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:14px;}
.kv dt{color:var(--text2);font-size:13px;}
.kv dd{white-space:pre-wrap;word-break:break-word;}
.its{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px;}
.its td,.its th{padding:6px 4px;border-bottom:1px solid var(--border);text-align:left;}
.its th{font-size:11px;color:var(--text2);text-transform:uppercase;}
.its .n{text-align:right;white-space:nowrap;}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;}
.ph-t{position:relative;aspect-ratio:1;border-radius:var(--r2);overflow:hidden;background:#e5e7eb;}
.ph-t img{width:100%;height:100%;object-fit:cover;display:block;}
.ph-t .x{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;width:26px;height:26px;font-size:13px;}
.addbar{display:flex;gap:8px;margin-top:8px;}
.addbar .btn{flex:1;}
.sig-full{position:fixed;inset:0;z-index:80;background:var(--surface);display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top)) 14px calc(12px + env(safe-area-inset-bottom));overscroll-behavior:none;touch-action:none;}
.sig-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px;}
.sig-termo{font-size:12px;color:var(--text2);background:var(--blue-light);border-radius:var(--r2);padding:8px 10px;margin-bottom:10px;}
.sig-wrap{position:relative;border:2px dashed var(--border2);border-radius:var(--r2);background:#fff;flex:1;min-height:180px;touch-action:none;}
.sig-wrap canvas{width:100%;height:100%;display:block;touch-action:none;}
.sig-ph{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;color:var(--text3);pointer-events:none;font-size:15px;}
.sig-bar{display:flex;gap:8px;margin-top:10px;}
.sig-bar .btn{flex:1;}
.sig-bar #sig-ok{flex:2;}
.sig-img{background:#fff;border:1px solid var(--border);border-radius:var(--r2);padding:6px;max-width:360px;}
.sig-img img{width:100%;display:block;}
.mdl-x{background:none;border:none;font-size:24px;color:var(--text3);}
.empty{text-align:center;color:var(--text3);padding:40px 16px;}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:20px;z-index:90;font-size:13px;box-shadow:var(--sh2);max-width:90vw;text-align:center;}
.err{background:var(--red-light);color:var(--red);border-radius:var(--r2);padding:10px 12px;margin-bottom:12px;font-size:13px;}
.info{background:var(--blue-light);color:var(--blue-dark);border-radius:var(--r2);padding:10px 12px;margin-bottom:12px;font-size:13px;}
.okbox{background:var(--green-light);color:#046c4e;border-radius:var(--r2);padding:10px 12px;margin-bottom:12px;font-size:13px;}
.sec{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text2);margin:4px 0 10px;}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.actions .btn{flex:1;min-width:140px;}
.step{display:flex;align-items:center;gap:8px;}
.step .n{width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;}
.step.done .n{background:var(--green);}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px;}
@keyframes sp{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="top"><div class="top-in" id="top"></div></div>
<main id="app"><div class="empty">Carregando…</div></main>
<script>
/* ═══ Entregas de campo ══════════════════════════════════════════════════
   O técnico que sai para a rua abre no celular o pedido de venda do Bling (em
   vez de levar o pedido impresso), registra fotos e observações, o cliente
   assina na tela e o PDF assinado vai para o WhatsApp do cliente pelo número
   oficial da loja (servidor whatsapp-crm).
   Mesmo projeto Firebase da Oficina, em coleções próprias:
   - campo_pedidos  → o registro do atendimento (id = id do pedido no Bling)
   - campo_midias   → uma foto por documento, carregadas só ao abrir o pedido
   - campo_tecnicos → nomes dos técnicos de rua
   - campo_localizacoes → posição do técnico (ver "Localização" abaixo) */
var FB_CFG={
  apiKey:"AIzaSyCdRdPIM7fjV-5prMCHs_3eYqS5aARSu5I",
  authDomain:"aquapure-9100b.firebaseapp.com",
  projectId:"aquapure-9100b",
  storageBucket:"aquapure-9100b.firebasestorage.app",
  messagingSenderId:"132328899335",
  appId:"1:132328899335:web:d9e7b99354b51de0a37ba2"
};
var API='https://whatsapp-crm-production-66bf.up.railway.app';
var C_LOC='campo_localizacoes',C_REG='campo_pedidos',C_MID='campo_midias',C_TEC='campo_tecnicos';
var MAX_FOTOS=8;
/* Perguntas obrigatórias do atendimento: respondidas antes da assinatura e
   impressas no PDF. A observação de cada uma é opcional. */
var CHECK=[
  {k:'higienizacao',p:'O aparelho precisa de higienização?',o:['Sim','Não','Feita neste atendimento'],obs:'Observação (opcional)'},
  {k:'pressao',p:'Qual a pressão do local?',o:['Baixa','Normal','Alta','Não foi possível medir'],obs:'Valor medido ou observação (opcional)'},
  {k:'mangueiras',p:'As mangueiras estão ressecadas ou foram trocadas há mais de um ano?',o:['Sim','Não','Trocadas neste atendimento','Não verificado'],obs:'Observação (opcional)'}
];
var TERMO='Declaro que recebi nesta data os produtos e/ou serviços descritos neste pedido, nas condições registradas acima.';

/* ═══ Estado ═════════════════════════════════════════════════════════════ */
var db=null,FB_ERR='';
var S={
  tela:'lista',tecnico:lsGet('campo_tecnico')||'',tecs:[],
  lista:null,listaErr:'',carregando:false,filtro:'hoje',hoje:'',busca:'',
  reg:{},              /* campo_pedidos por id do pedido no Bling */
  ped:null,pedErr:'',midias:[],enviando:false
};

function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}

function initFirebase(){
  if(typeof firebase==='undefined'){FB_ERR='As bibliotecas do Firebase não carregaram. Verifique a internet e recarregue a página.';return false;}
  try{
    if(!firebase.apps.length)firebase.initializeApp(FB_CFG);
    db=firebase.firestore();
    /* Na rua o sinal cai: com o cache local, fotos e observações ficam salvas
       no aparelho e sobem sozinhas quando a conexão volta. */
    db.enablePersistence({synchronizeTabs:true}).catch(function(){});
  }catch(e){FB_ERR='Falha ao iniciar o Firebase: '+e.message;return false;}
  return true;
}
function listen(){
  db.collection(C_TEC).onSnapshot(function(snap){
    S.tecs=snap.docs.map(function(d){return d.data().nome||'';}).filter(Boolean).sort(function(a,b){return a.localeCompare(b);});
    if(S.tela==='quem')render();
  },function(){});
  db.collection(C_REG).orderBy('atualizadoEm','desc').limit(300).onSnapshot(function(snap){
    S.reg={};snap.docs.forEach(function(d){S.reg[d.id]=d.data();});
    if(S.tela==='lista')renderLista();
  },function(){});
}

/* ═══ Utilidades ═════════════════════════════════════════════════════════ */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function $(id){return document.getElementById(id);}
function val(id){var e=$(id);return e?String(e.value||'').trim():'';}
function toast(m){var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove();},3200);}
function pad(n){return n<10?'0'+n:''+n;}
function fmtDH(ms){if(!ms)return'-';var d=new Date(ms);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes());}
function fmtData(iso){if(!iso||String(iso).indexOf('0000')===0)return'';var p=String(iso).slice(0,10).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:iso;}
function money(v){return'R$ '+(Number(v)||0).toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,'.');}
function semAcento(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();}
function soDig(s){return String(s||'').replace(/\D/g,'');}
function fmtFone(s){var d=soDig(s);if(d.length===11)return'('+d.slice(0,2)+') '+d.slice(2,7)+'-'+d.slice(7);if(d.length===10)return'('+d.slice(0,2)+') '+d.slice(2,6)+'-'+d.slice(6);return s||'';}
function hojeISO(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
async function api(caminho,opts){
  var r=await fetch(API+caminho,opts);
  var j=null;try{j=await r.json();}catch(e){}
  if(!r.ok)throw new Error(j&&j.error||('Erro '+r.status+' no servidor'));
  return j;
}

/* ═══ Telas ══════════════════════════════════════════════════════════════ */
function render(){
  if(FB_ERR){$('top').innerHTML='<h1>🚚 Entregas</h1>';$('app').innerHTML='<div class="err">'+esc(FB_ERR)+'</div>';return;}
  if(!S.tecnico||S.tela==='quem')return renderQuem();
  if(S.tela==='ped')return renderPedido();
  renderLista();
}

/* Primeiro acesso no aparelho: o técnico escolhe o nome dele. */
function renderQuem(){
  $('top').innerHTML='<h1>🚚 Entregas</h1>';
  var h='<div class="card"><h3>Quem está usando este celular?</h3>'
    +'<div class="sub" style="margin-bottom:12px;">O seu nome sai no pedido assinado que o cliente recebe.</div>';
  if(S.tecs.length)h+='<div class="chips" style="flex-wrap:wrap;">'+S.tecs.map(function(n,i){return'<button class="chip'+(n===S.tecnico?' on':'')+'" onclick="escolherTec('+i+')">'+esc(n)+'</button>';}).join('')+'</div>';
  h+='<div class="field"><label>'+(S.tecs.length?'Não está na lista? Digite seu nome':'Seu nome')+'</label><input id="q-nome" placeholder="Ex.: Carlos" autocomplete="name"/></div>'
    +'<button class="btn btn-p btn-lg" onclick="salvarTec()">Continuar</button></div>';
  $('app').innerHTML=h;
}
function escolherTec(i){S.tecnico=S.tecs[i];lsSet('campo_tecnico',S.tecnico);S.tela='lista';render();if(!S.lista)carregarLista();iniciarLocal();}
function salvarTec(){
  var n=val('q-nome');if(!n){toast('Digite seu nome');return;}
  S.tecnico=n;lsSet('campo_tecnico',n);
  if(db&&S.tecs.map(semAcento).indexOf(semAcento(n))<0)db.collection(C_TEC).add({nome:n,criadoEm:Date.now()}).catch(function(){});
  S.tela='lista';render();if(!S.lista)carregarLista();iniciarLocal();
}

/* ═══ Entregas (pedidos do Bling pela data prevista = dia da entrega) ═══
   Um filtro por data, em sequência: de 7 dias atrás até as próximas entregas.
   Abre no dia de hoje ou, sem entrega hoje, na próxima data com entrega. */
async function carregarLista(){
  if(S.carregando)return;
  S.carregando=true;S.listaErr='';renderLista();
  try{
    var r=await api('/api/bling/campo/pedidos?antes=7&depois=7');
    S.lista=r.pedidos;S.hoje=r.hoje;
    lsSet('campo_lista',JSON.stringify({em:Date.now(),hoje:r.hoje,lista:S.lista}));
  }catch(e){S.listaErr=e.message;}
  S.carregando=false;
  if(S.tela==='lista')renderLista();
}
function diaMais(n){var d=new Date((S.hoje||hojeISO())+'T12:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function prev(o){return String(o.dataPrevista||'').slice(0,10);}
var DIAS_SEM=['dom','seg','ter','qua','qui','sex','sáb'];
function rotuloDia(iso){
  if(iso===(S.hoje||hojeISO()))return'Hoje';
  if(iso===diaMais(1))return'Amanhã';
  if(iso===diaMais(-1))return'Ontem';
  var d=new Date(iso+'T12:00:00');return DIAS_SEM[d.getDay()]+' '+iso.slice(8,10)+'/'+iso.slice(5,7);
}
function datasDaLista(){
  var c={};(S.lista||[]).forEach(function(o){var d=prev(o);if(d)c[d]=(c[d]||0)+1;});
  return{datas:Object.keys(c).sort(),cont:c};
}
/* Data padrão: hoje, ou a próxima com entrega, ou a mais recente. */
function dataPadrao(datas){
  var h=S.hoje||hojeISO();
  for(var i=0;i<datas.length;i++)if(datas[i]>=h)return datas[i];
  return datas[datas.length-1]||'';
}
function idsAssinados(){return Object.keys(S.reg).filter(function(id){return!!S.reg[id].assinatura;});}
function statusReg(id){
  var r=S.reg[String(id)];
  if(!r)return'';
  if(r.envio&&r.envio.ok)return'<span class="badge b-green">✔ Enviado</span>';
  if(r.assinatura)return'<span class="badge b-amber">Assinado · não enviado</span>';
  return'<span class="badge b-gray">Em atendimento</span>';
}
function renderLista(){
  if(!S.tecnico)return renderQuem();
  $('top').innerHTML='<h1>🚚 Entregas</h1><button class="who" onclick="S.tela=\'quem\';render()">👷 '+esc(S.tecnico)+'</button>';
  var dl=datasDaLista();
  if(S.filtro!=='feitas'&&!dl.cont[S.filtro])S.filtro=dataPadrao(dl.datas);
  var h='<input class="search" id="busca" placeholder="Buscar nº do pedido ou cliente" value="'+esc(S.busca)+'" oninput="S.busca=this.value;desenharItens()"/>'
    +'<div class="chips" id="chips-datas">'
    +dl.datas.map(function(d){return'<button class="chip'+(S.filtro===d?' on':'')+'" data-d="'+d+'" onclick="filtrar(\''+d+'\')">'+esc(rotuloDia(d))+' ('+dl.cont[d]+')</button>';}).join('')
    +'</div><div class="chips">'
    +'<button class="chip'+(S.filtro==='feitas'?' on':'')+'" onclick="filtrar(\'feitas\')">✍️ Assinados ('+idsAssinados().length+')</button>'
    +'<button class="chip" onclick="carregarLista()">'+(S.carregando?'<span class="spin"></span>':'↻')+' Atualizar</button></div>';
  if(S.listaErr)h+='<div class="err">Não foi possível buscar os pedidos no Bling: '+esc(S.listaErr)+'</div>';
  if(S.carregando&&!S.lista)h+='<div class="info"><span class="spin"></span> Buscando as entregas no Bling…</div>';
  h+='<div id="itens"></div>';
  $('app').innerHTML=h;
  /* A fila de datas começa 7 dias atrás: rola até a data escolhida. */
  var on=document.querySelector('#chips-datas .chip.on');
  if(on){var box=$('chips-datas');box.scrollLeft=on.offsetLeft-box.offsetLeft-8;}
  desenharItens();
}
function filtrar(f){S.filtro=f;renderLista();}
function desenharItens(){
  var el=$('itens');if(!el)return;
  var lista=(S.lista||[]).slice(),q=semAcento(S.busca),busca=!!q;
  if(busca){
    /* Busca procura em todas as datas, não só na escolhida. */
    lista=lista.filter(function(o){return semAcento([o.numero,o.cliente].join(' ')).indexOf(q)>=0;});
  }else if(S.filtro==='feitas'){
    lista=idsAssinados().map(function(id){var r=S.reg[id];return{id:Number(id),numero:r.numero,cliente:r.cliente,total:r.total,dataPrevista:r.pedido&&r.pedido.dataPrevista,_em:r.atualizadoEm};})
      .sort(function(a,b){return(b._em||0)-(a._em||0);});
  }else{
    lista=lista.filter(function(o){return prev(o)===S.filtro;});
  }
  if(!lista.length){
    var msg=S.carregando||!S.lista?'':S.filtro==='feitas'&&!busca?'Nenhum pedido assinado ainda.':busca?'Nenhum pedido encontrado.':'Nenhuma entrega prevista de 7 dias atrás em diante.';

function salvarCampos(extra){

/* ═══ Fotos ══════════════════════════════════════════════════════════════
   Reduzidas no aparelho (1024px, JPEG) e gravadas uma por documento no
   Firestore: leves o bastante para o PDF ir pelo WhatsApp. */
function compressImg(file){
  return new Promise(function(ok,fail){
    var r=new FileReader();
    r.onerror=function(){fail(new Error('Não foi possível ler a imagem'));};
    r.onload=function(ev){
      var img=new Image();
      img.onerror=function(){fail(new Error('Formato de imagem não suportado'));};
      img.onload=function(){
        var M=1024,w=img.width,h=img.height;
        if(w>M||h>M){if(w>h){h=Math.round(h*M/w);w=M;}else{w=Math.round(w*M/h);h=M;}}
        var c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        ok({data:c.toDataURL('image/jpeg',0.68),w:w,h:h});
      };
      img.src=ev.target.result;
    };
    r.readAsDataURL(file);
  });
}
function addFoto(camera){
  if(S.midias.length>=MAX_FOTOS){toast('Máximo de '+MAX_FOTOS+' fotos');return;}
  var inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  if(camera)inp.capture='environment';else inp.multiple=true;
  inp.onchange=async function(e){
    var files=Array.prototype.slice.call(e.target.files||[]),pedidoId=String(S.ped.id);
    var st=$('foto-st');
    for(var i=0;i<files.length&&S.midias.length<MAX_FOTOS;i++){
      if(st)st.textContent='Salvando foto…';
      try{
        var f=await compressImg(files[i]);
        var m={pedidoId:pedidoId,data:f.data,w:f.w,h:f.h,criadoEm:Date.now(),tecnico:S.tecnico};
        var ref=db.collection(C_MID).doc();
        ref.set(m).catch(function(err){toast('Foto não salva: '+err.message);});
        m.id=ref.id;S.midias.push(m);
      }catch(err){toast(err.message);}
    }
    if(!S.reg[pedidoId])salvarCampos();
    if(S.tela==='ped'&&String(S.ped.id)===pedidoId)renderPedido();
  };
  inp.click();
}
function rmFoto(id){
  if(!confirm('Apagar esta foto?'))return;
  S.midias=S.midias.filter(function(m){return m.id!==id;});
  db.collection(C_MID).doc(id).delete().catch(function(){});
  renderPedido();
}

/* ═══ Assinatura ═════════════════════════════════════════════════════════
   Tela cheia própria, com a página travada atrás (senão o dedo rola a tela
   em vez de desenhar). Na confirmação gravamos hora e GPS do aparelho. */
var SIG=null;
function assinar(){
  var ck=ckLer(),falta=CHECK.filter(function(q){return!ck[q.k]||!ck[q.k].r;});
  if(falta.length){
    toast(falta.length===1?'Responda a pergunta '+(CHECK.indexOf(falta[0])+1)+' antes da assinatura':'Responda as perguntas '+falta.map(function(q){return CHECK.indexOf(q)+1;}).join(', ')+' antes da assinatura');
    $('ck-'+falta[0].k).scrollIntoView({behavior:'smooth',block:'center'});return;
  }
  var nome=val('rec-nome');
  if(!nome){toast('Preencha quem está recebendo/assinando');$('rec-nome').focus();return;}
  salvarCampos();
  pegarLocal();
  var ov=document.createElement('div');ov.className='sig-full';ov.id='sig-full';
  ov.innerHTML='<div class="sig-top"><div><b>Assinatura — '+esc(nome)+'</b><div class="sub">Pedido '+esc(S.ped.numero||'')+' · '+esc(S.ped.cliente&&S.ped.cliente.nome||'')+'</div></div>'
    +'<button class="mdl-x" onclick="fecharAssin()">✕</button></div>'
    +'<div class="sig-termo">'+esc(TERMO)+'</div>'
    +'<div class="sig-wrap"><canvas id="sig-cv"></canvas><span class="sig-ph" id="sig-ph">Assine aqui com o dedo</span></div>'
    +'<div class="sig-bar"><button class="btn btn-g" onclick="limparAssin()">Limpar</button>'
    +'<button class="btn btn-g" onclick="fecharAssin()">Cancelar</button>'
    +'<button class="btn btn-ok" id="sig-ok">✔ Confirmar</button></div>';
  ov.addEventListener('touchmove',function(e){e.preventDefault();},{passive:false});
  document.body.appendChild(ov);
  document.documentElement.style.overflow='hidden';document.body.style.overflow='hidden';
  initAssin();
  $('sig-ok').onclick=confirmarAssin;
}
function fecharAssin(){
  var ov=$('sig-full');if(ov)ov.remove();SIG=null;
  document.documentElement.style.overflow='';document.body.style.overflow='';
}
function initAssin(){
  var cv=$('sig-cv');if(!cv)return;
  var b=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  cv.width=Math.round(b.width*dpr);cv.height=Math.round(b.height*dpr);
  var ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
  ctx.lineWidth=2.6;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#111827';
  SIG={cv:cv,ctx:ctx,vazio:true,des:false,dpr:dpr,x0:1e9,y0:1e9,x1:-1e9,y1:-1e9};
  function marca(p){SIG.x0=Math.min(SIG.x0,p.x);SIG.y0=Math.min(SIG.y0,p.y);SIG.x1=Math.max(SIG.x1,p.x);SIG.y1=Math.max(SIG.y1,p.y);}
  function pt(e){var r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
  cv.onpointerdown=function(e){e.preventDefault();cv.setPointerCapture(e.pointerId);SIG.des=true;var p=pt(e);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+0.1,p.y+0.1);ctx.stroke();marca(p);
    if(SIG.vazio){SIG.vazio=false;var ph=$('sig-ph');if(ph)ph.style.display='none';}};
  cv.onpointermove=function(e){if(!SIG.des)return;e.preventDefault();var p=pt(e);ctx.lineTo(p.x,p.y);ctx.stroke();marca(p);};
  cv.onpointerup=cv.onpointercancel=function(){SIG.des=false;};
}
function limparAssin(){
  if(!SIG)return;
  SIG.ctx.clearRect(0,0,SIG.cv.width,SIG.cv.height);SIG.vazio=true;
  SIG.x0=SIG.y0=1e9;SIG.x1=SIG.y1=-1e9;
  var ph=$('sig-ph');if(ph)ph.style.display='';
}
/* Recorta só a área desenhada e reduz para no máximo 600px. */
function lerAssin(){
  if(!SIG||SIG.vazio)return null;
  var d=SIG.dpr,m=12,sx=Math.max(0,(SIG.x0-m)*d),sy=Math.max(0,(SIG.y0-m)*d);
  var sw=Math.min(SIG.cv.width-sx,(SIG.x1-SIG.x0+2*m)*d),sh=Math.min(SIG.cv.height-sy,(SIG.y1-SIG.y0+2*m)*d);
  var k=Math.min(1,600/sw),W=Math.max(1,Math.round(sw*k)),H=Math.max(1,Math.round(sh*k)),c=document.createElement('canvas');
  c.width=W;c.height=H;c.getContext('2d').drawImage(SIG.cv,sx,sy,sw,sh,0,0,W,H);
  return{img:c.toDataURL('image/png'),w:W,h:H,em:Date.now(),termo:TERMO};
}
/* GPS pedido ao abrir a tela de assinatura: até o cliente terminar, a posição
   já chegou. Sem permissão ou sem sinal, o pedido sai sem localização. */
var LOCAL=null,LOCAL_P=null;
function pegarLocal(){
  LOCAL=null;
  LOCAL_P=new Promise(function(ok){
    if(!navigator.geolocation)return ok();
    navigator.geolocation.getCurrentPosition(function(p){
      LOCAL={lat:p.coords.latitude,lng:p.coords.longitude,precisao:Math.round(p.coords.accuracy||0),em:p.timestamp||Date.now()};ok();
    },function(){ok();},{enableHighAccuracy:true,timeout:20000,maximumAge:120000});
  });
}
async function confirmarAssin(){
  var a=lerAssin();if(!a){toast('Peça para o cliente assinar no quadro.');return;}
  fecharAssin();
  /* Assinatura rápida: espera até 8s pelo GPS antes de gravar. */
  if(!LOCAL&&LOCAL_P){toast('Registrando localização…');await Promise.race([LOCAL_P,new Promise(function(ok){setTimeout(ok,8000);})]);}
  await salvarCampos({assinatura:a,local:LOCAL||null}).catch(function(e){toast('Erro ao salvar: '+e.message);});
  if(LOCAL)gravarLocal(LOCAL,LOCAL.em,'assinatura',{pedido:S.ped.numero||'',cliente:(S.ped.cliente&&S.ped.cliente.nome)||''});
  renderPedido();
  toast('Assinatura salva');
  if($('b-env'))enviarWhats();
}
function desfazerAssin(){
  if(!confirm('Apagar a assinatura e colher de novo?'))return;
  var id=String(S.ped.id);
  if(S.reg[id]){delete S.reg[id].assinatura;delete S.reg[id].local;}
  db.collection(C_REG).doc(id).update({assinatura:firebase.firestore.FieldValue.delete(),local:firebase.firestore.FieldValue.delete(),atualizadoEm:Date.now()}).catch(function(){});
  renderPedido();
}

function carregarJsPDF(){
  if(window.jspdf)return Promise.resolve();
  if(_jspdfP)return _jspdfP;

    sc.onerror=function(){_jspdfP=null;fail(new Error('Não foi possível carregar o gerador de PDF. Verifique a internet.'));};

}

  doc.setTextColor(30,30,30);doc.setFont('helvetica','normal');doc.setFontSize(8.5);
  return 27;
}
function pdfCabecalho(doc,titulo,subtitulo,infos){

  doc.setDrawColor(a[0],a[1],a[2]);doc.setLineWidth(0.6);doc.line(ML,29,MR,29);

  doc.setFillColor(240,247,250);doc.roundedRect(ML,33,MR-ML,13,1.5,1.5,'F');

function pdfRodape(doc,nowStr){

    doc.text(PURIFIC.endereco+'  ·  Tel. '+PURIFIC.tel+'  ·  WhatsApp '+PURIFIC.whats,PW/2,288.5,{align:'center'});

async function montarPdf(){
  await carregarJsPDF();
  var o=S.ped,r=regAtual(),c=o.cliente||{},a=r.assinatura||{};
  var doc=new window.jspdf.jsPDF();
  var ML=14,MR=196,az=PURIFIC.azul;
  var y=pdfCabecalho(doc,'PEDIDO DE VENDA','Comprovante de entrega · assinado digitalmente',[
    ['N° Pedido',o.numero||'-'],['Atendimento',fmtDH(a.em||Date.now())],['Técnico',S.tecnico]
  ]);
  function chk(n){if(y+n>272)y=pdfNovaPagina(doc);}
  function section(t){
    chk(26);y+=3;
    doc.setFillColor(240,247,250);doc.rect(ML,y-4.5,MR-ML,7,'F');
    doc.setFillColor(az[0],az[1],az[2]);doc.rect(ML,y-4.5,1.6,7,'F');
    doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(az[0],az[1],az[2]);
    doc.text(t,ML+4,y);doc.setTextColor(30,30,30);doc.setFontSize(8.5);y+=7;
  }
  function line(lbl,v){
    if(!v)return;
    var ls=doc.splitTextToSize(String(v),MR-ML-40);chk(ls.length*4.5+2);
    doc.setFont('helvetica','bold');doc.text(lbl+':',ML,y);
    doc.setFont('helvetica','normal');doc.text(ls,ML+40,y);y+=ls.length*4.5+1.5;
  }
  function texto(v){
    var ls=doc.splitTextToSize(String(v),MR-ML-4);
    for(var i=0;i<ls.length;i++){chk(5);doc.setFont('helvetica','normal');doc.text(ls[i],ML+2,y);y+=4.5;}
    y+=1.5;
  }
  doc.setFontSize(8.5);
  section('Cliente');
  line('Nome',c.nome);line('CPF/CNPJ',c.documento);
  line('Telefone',[c.celular,c.telefone].filter(Boolean).map(fmtFone).join(' / '));
  line('Entrega',[c.endereco,c.cidade,c.cep?'CEP '+c.cep:''].filter(Boolean).join(' — '));
  line('Data do pedido',fmtData(o.data));line('Vendedor',o.vendedor);
  var its=o.itens||[];
  if(its.length){
    section('Itens do pedido');
    doc.setFont('helvetica','bold');doc.setFontSize(7.5);doc.setTextColor(110,110,110);
    doc.text('ITEM',ML+2,y);doc.text('QTD',140,y,{align:'right'});doc.text('UNIT.',165,y,{align:'right'});doc.text('TOTAL',MR-2,y,{align:'right'});y+=4.5;
    doc.setTextColor(30,30,30);doc.setFontSize(8.5);
    its.forEach(function(i){
      var ls=doc.splitTextToSize((i.codigo?i.codigo+' - ':'')+i.descricao,110);chk(ls.length*4.5+2);
      doc.setFont('helvetica','normal');doc.text(ls,ML+2,y);
      doc.text(String(i.qtd||'')+(i.unidade?' '+i.unidade:''),140,y,{align:'right'});
      if(i.valor){doc.text(money(i.valor),165,y,{align:'right'});doc.text(money(i.valor*(i.qtd||1)),MR-2,y,{align:'right'});}
      y+=ls.length*4.5+1;
      doc.setDrawColor(230,230,230);doc.setLineWidth(0.2);doc.line(ML,y-2.5,MR,y-2.5);
    });
    var tot=[];
    if(o.frete)tot.push('Frete: '+money(o.frete));
    if(o.desconto)tot.push('Desconto: -'+money(o.desconto));
    if(o.outrasDespesas)tot.push('Outras despesas: '+money(o.outrasDespesas));
    doc.setFont('helvetica','normal');
    tot.forEach(function(t){chk(5);y+=1;doc.text(t,MR-2,y,{align:'right'});y+=3.5;});
    if(o.total){chk(8);y+=2;doc.setFont('helvetica','bold');doc.text('Total: '+money(o.total),MR-2,y,{align:'right'});y+=6;}
  }
  if(o.observacoes){section('Observações do pedido');texto(o.observacoes);}
  var ck=r.checklist||{};
  if(CHECK.some(function(q){return ck[q.k]&&ck[q.k].r;})){
    section('Verificações do técnico');
    CHECK.forEach(function(q,i){
      var a=ck[q.k];if(!a||!a.r)return;
      var lq=doc.splitTextToSize((i+1)+'. '+q.p,MR-ML-4),la=doc.splitTextToSize(a.r+(a.obs?' — '+a.obs:''),MR-ML-10);
      chk((lq.length+la.length)*4.5+2);
      doc.setFont('helvetica','bold');doc.text(lq,ML+2,y);y+=lq.length*4.5;
      doc.setFont('helvetica','normal');doc.text(la,ML+8,y);y+=la.length*4.5+1.5;
    });
  }
  if(r.obs){section('Observações do técnico');texto(r.obs);}
  var fotos=S.midias.filter(function(m){return m.data;});
  if(fotos.length){
    section('Fotos do atendimento');
    var W=58,H=44,G=4;
    for(var i=0;i<fotos.length;i++){
      var col=i%3;
      if(col===0){if(i>0)y+=H+G;if(y+H>272)y=pdfNovaPagina(doc);}
      var x=ML+col*(W+G),f=fotos[i],w=W,h=H;
      if(f.w&&f.h){var k=Math.min(W/f.w,H/f.h);w=f.w*k;h=f.h*k;}
      try{doc.addImage(f.data,'JPEG',x+(W-w)/2,y+(H-h)/2,w,h);}catch(e){}
      doc.setDrawColor(210,210,210);doc.setLineWidth(0.2);doc.rect(x,y,W,H);
    }
    y+=H+4;
  }
  section('Declaração do cliente');
  texto(a.termo||TERMO);
  /* Assinatura do cliente e identificação do técnico */
  if(y+58>272)y=pdfNovaPagina(doc);
  y+=4;
  doc.setDrawColor(215,222,226);doc.setLineWidth(0.3);doc.roundedRect(ML,y,MR-ML,40,2,2,'S');
  doc.setFontSize(7.5);doc.setTextColor(110,110,110);doc.text('Sorocaba/SP, '+dataExtenso(new Date(a.em||Date.now())),ML+6,y+6);
  var cx1=ML+(MR-ML)/4,cx2=ML+3*(MR-ML)/4,base=y+28;
  if(a.img){try{var ar=(a.w||600)/Math.max(1,a.h||200),sw=Math.min(70,18*ar),sh=sw/ar;doc.addImage(a.img,'PNG',cx1-sw/2,base-0.5-sh,sw,sh);}catch(e){}}
  doc.setDrawColor(70,70,70);doc.setLineWidth(0.35);doc.line(cx1-36,base,cx1+36,base);doc.line(cx2-36,base,cx2+36,base);
  doc.setFont('helvetica','bold');doc.setFontSize(8.5);doc.setTextColor(az[0],az[1],az[2]);
  var rec=r.recebedor||{};
  doc.text(rec.nome||c.nome||'Cliente',cx1,base+5,{align:'center'});doc.text(S.tecnico,cx2,base+5,{align:'center'});
  doc.setFont('helvetica','normal');doc.setFontSize(6.5);doc.setTextColor(140,140,140);
  doc.text(rec.doc?'Documento: '+rec.doc:'Recebedor',cx1,base+9,{align:'center'});
  doc.text('Técnico · '+PURIFIC.nome,cx2,base+9,{align:'center'});
  y+=44;
  /* Registro da assinatura: o comprovante de quando e onde foi assinada. */
  var reg=['Assinado na tela do aparelho do técnico em '+fmtDH(a.em)+'.'];
  if(r.local&&r.local.lat)reg.push('Localização: '+r.local.lat.toFixed(6)+', '+r.local.lng.toFixed(6)+' (precisão ~'+r.local.precisao+' m) — https://maps.google.com/?q='+r.local.lat.toFixed(6)+','+r.local.lng.toFixed(6));
  else reg.push('Localização: não disponível no momento da assinatura.');
  doc.setFontSize(6.8);doc.setTextColor(120,120,120);
  reg.forEach(function(t){var ls=doc.splitTextToSize(t,MR-ML);chk(ls.length*3.5);doc.text(ls,ML,y);y+=ls.length*3.5;});
  doc.setTextColor(30,30,30);
  pdfRodape(doc,new Date().toLocaleDateString('pt-BR'));
  return doc;
}
function nomePdf(){return'Pedido-'+(S.ped.numero||S.ped.id)+'-assinado.pdf';}
async function verPdf(){
  try{var doc=await montarPdf();window.open(URL.createObjectURL(doc.output('blob')),'_blank');}
  catch(e){alert('Erro ao gerar o PDF: '+e.message);}
}
/* Plano B: o próprio celular compartilha o PDF (WhatsApp do aparelho). */
async function compartilhar(){
  try{
    var doc=await montarPdf(),blob=doc.output('blob'),f=new File([blob],nomePdf(),{type:'application/pdf'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){
      await navigator.share({files:[f],title:nomePdf(),text:'Segue o seu pedido nº '+(S.ped.numero||'')+' assinado. Purific'});
    }else{
      var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nomePdf();
      document.body.appendChild(a);a.click();a.remove();
      toast('PDF baixado — anexe no WhatsApp');
    }
  }catch(e){if(e&&e.name!=='AbortError')alert('Não foi possível compartilhar: '+e.message);}
}
function blobParaDataUrl(b){return new Promise(function(ok,fail){var fr=new FileReader();fr.onload=function(){ok(fr.result);};fr.onerror=function(){fail(new Error('Falha ao ler o PDF'));};fr.readAsDataURL(b);});}
async function enviarWhats(){
  if(S.enviando)return;
  var fone=val('fone');
  S.enviando=true;renderPedido();
  var id=String(S.ped.id);
  try{
    var doc=await montarPdf();
    var pdf=await blobParaDataUrl(doc.output('blob'));
    var resp=await api('/api/bling/campo/enviar',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({pedidoId:S.ped.id,telefone:fone,pdf:pdf,tecnico:S.tecnico})});
    await salvarCampos({envio:{ok:true,em:Date.now(),telefone:resp.telefone,via:resp.via,por:S.tecnico}}).catch(function(){});
    toast('Pedido enviado para o WhatsApp do cliente ✔');
  }catch(e){
    await salvarCampos({envio:{ok:false,em:Date.now(),erro:e.message,por:S.tecnico}}).catch(function(){});
    alert('Não foi possível enviar pelo número da loja:\n\n'+e.message+'\n\nUse "Enviar pelo celular" para mandar agora pelo WhatsApp do aparelho.');
  }
  S.enviando=false;
  if(S.tela==='ped'&&String(S.ped.id)===id)renderPedido();
}

/* ═══ Localização do técnico ════════════════════════════════════════════
   Sem app instalado o navegador só entrega o GPS com o app aberto na tela:
   grava a posição ao abrir o app, a cada 10 minutos enquanto ele estiver
   aberto e na assinatura de cada pedido. A tela /campo/mapa/ desenha o
   caminho do dia. */
var LOC_INTERVALO=10*60*1000,_ultLoc=0,_locTimer=null;
function registrarLocal(origem,extra){
  if(!db||!S.tecnico||!navigator.geolocation)return;
  if(origem!=='assinatura'&&Date.now()-_ultLoc<2*60*1000)return;
  _ultLoc=Date.now();
  navigator.geolocation.getCurrentPosition(function(p){gravarLocal(p.coords,p.timestamp,origem,extra);},
    function(){},{enableHighAccuracy:true,timeout:30000,maximumAge:60000});
}
function gravarLocal(c,em,origem,extra){
  var d=new Date(em||Date.now());
  var doc={tecnico:S.tecnico,lat:c.latitude!=null?c.latitude:c.lat,lng:c.longitude!=null?c.longitude:c.lng,
    precisao:Math.round(c.accuracy!=null?c.accuracy:(c.precisao||0)),em:d.getTime(),
    dia:d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),origem:origem};
  if(extra)for(var k in extra)doc[k]=extra[k];
  db.collection(C_LOC).add(doc).catch(function(){});
}
function iniciarLocal(){
  registrarLocal('abertura');
  if(_locTimer)clearInterval(_locTimer);
  _locTimer=setInterval(function(){if(document.visibilityState==='visible')registrarLocal('periodico');},LOC_INTERVALO);
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')registrarLocal('abertura');});
}
