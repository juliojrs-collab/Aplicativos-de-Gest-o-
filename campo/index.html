<script>
/* ═══ Entregas de campo ══════════════════════════════════════════════════
   O técnico que sai para a rua abre no celular o pedido de venda do Bling (em
   vez de levar o pedido impresso), registra fotos e observações, o cliente
   assina na tela e o PDF assinado vai para o WhatsApp do cliente pelo número
   oficial da loja (servidor whatsapp-crm).
   Mesmo projeto Firebase da Oficina, em coleções próprias:
   - campo_pedidos  → o registro do atendimento (id = id do pedido no Bling)
   - campo_midias   → uma foto por documento, carregadas só ao abrir o pedido
   - campo_tecnicos → nomes dos técnicos de rua
   - campo_atribuicoes → técnico que vai fazer cada entrega (id = id do pedido)
   - campo_rotas → rota montada de cada técnico no dia (id = dia_técnico)
   - campo_localizacoes → posição do técnico (ver "Localização" abaixo) */
var FB_CFG={
  apiKey:"AIzaSyCdRdPIM7fjV-5prMCHs_3eYqS5aARSu5I",
  authDomain:"aquapure-9100b.firebaseapp.com",
  projectId:"aquapure-9100b",
  storageBucket:"aquapure-9100b.firebasestorage.app",
  messagingSenderId:"132328899335",
  appId:"1:132328899335:web:d9e7b99354b51de0a37ba2"
};
var API='https://whatsapp-crm-production-66bf.up.railway.app';
var C_ROTA='campo_rotas',C_ATR='campo_atribuicoes',C_LOC='campo_localizacoes',C_REG='campo_pedidos',C_MID='campo_midias',C_TEC='campo_tecnicos';
var MAX_FOTOS=4; /* por grupo */
/* Fotos do aparelho antes e depois do serviço, obrigatórias (ao menos uma de cada). */
var GRUPOS_FOTO=[{k:'antes',l:'Antes'},{k:'depois',l:'Depois'}];
function fotosDe(g){return S.midias.filter(function(m){return(m.grupo||'depois')===g;});}
/* Perguntas obrigatórias do atendimento: respondidas antes da assinatura e
   impressas no PDF. A observação de cada uma é opcional. */
/* Tipo de serviço, marcado pelo técnico (um ou mais). Define quais
   perguntas aparecem: "naoEm" tira a pergunta quando o tipo está marcado. */
var TIPOS=[{k:'refil',l:'Troca de refil'},{k:'hig',l:'Higienização'},
  {k:'inst_purif',l:'Instalação purificador'},{k:'inst_fc',l:'Instalação FC'},{k:'carga_fc',l:'Carga FC'},
  {k:'vazamento',l:'Visita Técnica (Vazamento)'},{k:'semagua',l:'Visita Técnica (Sem água)'},{k:'visita',l:'Visita Técnica (Geral)'},
  {k:'outro',l:'Outro'}];
/* "Instalação nova" (antes de separar purificador e FC) vale como instalação de purificador. */
var TIPO_ANTIGO={instalacao:'inst_purif'};
/* Serviços no filtro central ou de instalação: sem as perguntas do purificador em uso. */
var SEM_PERGUNTAS_PURIF=['inst_purif','inst_fc','carga_fc'];
var CHECK=[
  {k:'higienizacao',p:'O aparelho precisa de higienização?',o:['Sim','Não','Feita neste atendimento'],obs:'Observação (opcional)',naoEm:SEM_PERGUNTAS_PURIF},
  {k:'pressao',p:'Qual a pressão do local?',valor:'kgf/cm²'},
  {k:'mangueiras',p:'As mangueiras estão ressecadas ou foram trocadas há mais de um ano?',o:['Sim','Não','Trocadas neste atendimento','Não verificado'],obs:'Observação (opcional)',naoEm:SEM_PERGUNTAS_PURIF}
];
function tiposDe(r){return((r&&r.tipos)||[]).map(function(k){return TIPO_ANTIGO[k]||k;});}
/* Perguntas que valem para os tipos marcados. A pressão é do local: só no
   1º aparelho (semValor nos demais). */
function checkAtivo(tipos,semValor){return CHECK.filter(function(q){return!(semValor&&q.valor)&&!(q.naoEm||[]).some(function(t){return tipos.indexOf(t)>=0;});});}
/* Aparelhos do atendimento (um local pode ter mais de um). O 1º usa os campos
   de sempre (tipos, tipoOutro, checklist, aparNome e fotos 'antes'/'depois');
   os demais ficam em r.aparelhos [{id,nome,tipos,tipoOutro,checklist}], com
   fotos 'antes_<id>'/'depois_<id>'. suf é o sufixo dos ids na tela e das fotos. */
function aparelhosDe(r){
  r=r||{};
  var l=[{suf:'',id:'',nome:r.aparNome||'',tipos:r.tipos||[],tipoOutro:r.tipoOutro||'',checklist:r.checklist||{}}];
  (r.aparelhos||[]).forEach(function(a){l.push({suf:'_'+a.id,id:a.id,nome:a.nome||'',tipos:a.tipos||[],tipoOutro:a.tipoOutro||'',checklist:a.checklist||{}});});
  return l;
}
function grupoBase(g){return String(g||'depois').split('_')[0];}
function apDoGrupo(g,r){
  var i=String(g||'').indexOf('_'),suf=i<0?'':String(g).slice(i),aps=aparelhosDe(r||regAtual());
  return aps.filter(function(a){return a.suf===suf;})[0]||aps[0];
}
function tituloAp(ap,j){return'Aparelho '+(j+1)+(ap.nome?' — '+ap.nome:'');}
/* Os tipos de todos os aparelhos, para listas e planilha. */
function nomeTiposTodos(r){
  var aps=aparelhosDe(r);
  if(aps.length===1)return nomeTipos(aps[0]);
  return aps.map(function(a,j){return'Ap. '+(j+1)+': '+(nomeTipos(a)||'-');}).join(' | ');
}
function nomeTipos(r){return tiposDe(r).map(function(k){return k==='outro'?(r.tipoOutro||'Outro'):(TIPOS.filter(function(t){return t.k===k;})[0]||{l:k}).l;}).join(', ');}
/* Na instalação, "antes" é o local e "depois" é o equipamento instalado; na
   carga FC, o filtro antes e depois da carga. */
function rotuloFoto(g,r){
  g=grupoBase(g);
  var t=tiposDe(r),ip=t.indexOf('inst_purif')>=0,ifc=t.indexOf('inst_fc')>=0;
  if(ip||ifc){
    if(g==='antes')return'Foto do local antes da instalação';
    return'Foto do '+(ip&&ifc?'purificador e do filtro':ip?'purificador':'filtro')+' instalado'+(ip&&ifc?'s':'');
  }
  if(t.indexOf('carga_fc')>=0)return g==='antes'?'Foto do filtro antes da carga':'Foto do filtro depois da carga';

function listen(){
  db.collection(C_TEC).onSnapshot(function(snap){
    var docs=snap.docs.map(function(d){return d.data();}).filter(function(x){return x.nome;}),ordena=function(a,b){return a.localeCompare(b);};
    S.tecs=docs.map(function(x){return x.nome;}).sort(ordena);

       têm aba e rota; sem nenhum marcado, vale a lista inteira. */
    var rua=docs.filter(function(x){return x.rua;}).map(function(x){return x.nome;}).sort(ordena);
    S.tecsRua=rua.length?rua:S.tecs;
    if(S.tela==='quem')render();
    if(S.tela==='lista')desenharItens();
  },function(){});
  db.collection(C_ATR).orderBy('em','desc').limit(1000).onSnapshot(function(snap){
    S.atr={};snap.docs.forEach(function(d){S.atr[d.id]=d.data();});
    if(S.tela==='lista')renderLista();
  },function(){});
  db.collection(C_ROTA).orderBy('em','desc').limit(200).onSnapshot(function(snap){
    S.rotas={};snap.docs.forEach(function(d){S.rotas[d.id]=d.data();});
    if(S.tela==='lista')desenharItens();
  },function(){});
  db.collection(C_REG).orderBy('atualizadoEm','desc').limit(300).onSnapshot(function(snap){
    S.reg={};snap.docs.forEach(function(d){S.reg[d.id]=d.data();});
    if(S.tela==='lista')renderLista();
  },function(){});
}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function $(id){return document.getElementById(id);}
function val(id){var e=$(id);return e?String(e.value||'').trim():'';}
function toast(m){var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove();},3200);}
function pad(n){return n<10?'0'+n:''+n;}
function fmtDH(ms){if(!ms)return'-';var d=new Date(ms);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes());}
function fmtData(iso){if(!iso||String(iso).indexOf('0000')===0)return'';var p=String(iso).slice(0,10).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:iso;}
function money(v){return'R$ '+(Number(v)||0).toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,'.');}
function semAcento(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();}
function soDig(s){return String(s||'').replace(/\D/g,'');}
function fmtFone(s){var d=soDig(s);if(d.length===11)return'('+d.slice(0,2)+') '+d.slice(2,7)+'-'+d.slice(7);if(d.length===10)return'('+d.slice(0,2)+') '+d.slice(2,6)+'-'+d.slice(6);return s||'';}
function hojeISO(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
async function api(caminho,opts){

function entrar(perfil,nome){

/* ═══ Entregas (pedidos do Bling pela data prevista = dia da entrega) ═══
   Um filtro por data, em sequência: de 7 dias atrás até as próximas entregas.
   Abre no dia de hoje ou, sem entrega hoje, na próxima data com entrega. */
async function carregarLista(silencioso){
  if(S.carregando)return;
  S.carregando=true;S.listaEm=Date.now();
  var antes=JSON.stringify(S.lista||null);
  if(!silencioso){S.listaErr='';renderLista();}
  try{
    var r=await api('/api/bling/campo/pedidos?antes=7&depois=7');
    S.lista=r.pedidos;S.hoje=r.hoje;S.de=r.de;S.ate=r.ate;
    /* Períodos escolhidos em "Outro período" continuam na lista ao atualizar. */
    for(var i=0;i<S.periodos.length;i++){
      var pr=S.periodos[i];if(pr.de>=S.de&&pr.ate<=S.ate)continue;
      try{juntarPedidos((await api('/api/bling/campo/pedidos?de='+pr.de+'&ate='+pr.ate)).pedidos);}catch(e){}
    }
    lsSet('campo_lista',JSON.stringify({em:Date.now(),hoje:r.hoje,lista:S.lista}));
  }catch(e){if(!silencioso)S.listaErr=e.message;}
  S.carregando=false;
  if(S.tela!=='lista')return;
  /* Na atualização automática só redesenha se algo mudou e ninguém está no
     meio de uma ação (janela aberta, digitando, arrastando no quadro). */
  if(silencioso&&(JSON.stringify(S.lista||null)===antes||ocupado()))return;
  renderLista();
}
/* Atualização automática da lista do Bling a cada 3 min (só com o app na
   tela). Os relatórios dos técnicos já chegam na hora pelo Firestore. */
var LISTA_INTERVALO=3*60*1000;
function ocupado(){
  var a=document.activeElement;
  return!!(document.querySelector('.mdl-ov')||$('foto-ov')||_arrastando
    ||(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)));
}
function autoAtualizar(){
  if(document.visibilityState!=='visible'||!S.tecnico||!S.perfil)return;
  if(Date.now()-(S.listaEm||0)>=LISTA_INTERVALO-5000)carregarLista(true);
}
setInterval(autoAtualizar,LISTA_INTERVALO);
var _arrastando=false;
document.addEventListener('dragstart',function(){_arrastando=true;});
document.addEventListener('dragend',function(){_arrastando=false;});
document.addEventListener('visibilitychange',autoAtualizar);
function juntarPedidos(novos){
  var ids={};(S.lista||[]).forEach(function(o){ids[o.id]=1;});
  S.lista=(S.lista||[]).concat(novos.filter(function(o){return!ids[o.id];}));
}
/* "Outro período": qualquer intervalo, além dos 7 dias antes e depois. */
function abrirPeriodo(){
  var h=S.hoje||hojeISO(),ov=document.createElement('div');ov.className='mdl-ov';ov.id='per-ov';
  ov.onclick=function(e){if(e.target===ov)ov.remove();};
  ov.innerHTML='<div class="card"><h3>📅 Ver outro período</h3>'
    +'<div class="sub" style="margin-bottom:10px;">Busca no Bling as entregas com data prevista no período (até 3 meses). Para um dia só, use a mesma data nos dois campos.</div>'
    +'<div class="g2"><div class="field"><label>De</label><input type="date" id="per-de" value="'+h+'" onchange="if(val(\'per-ate\')<this.value)$(\'per-ate\').value=this.value"/></div>'
    +'<div class="field"><label>Até</label><input type="date" id="per-ate" value="'+h+'"/></div></div>'
    +'<div class="actions"><button class="btn btn-g" onclick="$(\'per-ov\').remove()">Cancelar</button><button class="btn btn-p" id="per-ok" onclick="verPeriodo(val(\'per-de\'),val(\'per-ate\'))">Ver entregas</button></div></div>';
  document.body.appendChild(ov);
}
async function verPeriodo(de,ate){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(de)||!/^\d{4}-\d{2}-\d{2}$/.test(ate)){toast('Escolha as duas datas');return;}
  if(ate<de){var x=de;de=ate;ate=x;}
  if((Date.parse(ate)-Date.parse(de))/86400000>93){toast('Escolha um período de até 3 meses');return;}
  var b=$('per-ok');if(b){b.disabled=true;b.innerHTML='<span class="spin"></span> Buscando…';}
  if(!(S.de&&de>=S.de&&ate<=S.ate)){
    try{juntarPedidos((await api('/api/bling/campo/pedidos?de='+de+'&ate='+ate)).pedidos);}
    catch(e){if(b){b.disabled=false;b.textContent='Ver entregas';}alert('Não foi possível buscar o período:\n\n'+e.message);return;}
  }
  S.periodos.push({de:de,ate:ate});
  var ov=$('per-ov');if(ov)ov.remove();
  /* Abre na primeira data do período que tem entrega (ou no início dele). */
  var tem=(S.lista||[]).map(prev).filter(function(d){return d>=de&&d<=ate;}).sort();
  if(!tem.length){S.diasExtra.push(de);toast('Nenhuma entrega com data prevista entre '+fmtData(de)+' e '+fmtData(ate));}
  else toast(tem.length+' entrega'+(tem.length===1?'':'s')+' no período');
  filtrar(tem[0]||de);
}
function diaDe(ms){var d=new Date(ms);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function diaMais(n){var d=new Date((S.hoje||hojeISO())+'T12:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function prev(o){return String(o.dataPrevista||'').slice(0,10);}
var DIAS_SEM=['dom','seg','ter','qua','qui','sex','sáb'];
function rotuloDia(iso){
  if(iso===(S.hoje||hojeISO()))return'Hoje';
  if(iso===diaMais(1))return'Amanhã';
  if(iso===diaMais(-1))return'Ontem';
  var d=new Date(iso+'T12:00:00');return DIAS_SEM[d.getDay()]+' '+iso.slice(8,10)+'/'+iso.slice(5,7);
}
function datasDaLista(){
  var c={};(S.lista||[]).forEach(function(o){var d=prev(o);if(d&&(!ehTec()||tecDe(o.id)===S.tecnico))c[d]=(c[d]||0)+1;});
  /* Dia escolhido em "Outra data" aparece mesmo sem entregas. */

  return{datas:Object.keys(c).sort(),cont:c};
}
/* Data padrão: hoje, ou a próxima com entrega, ou a mais recente. */
function dataPadrao(datas){
  var h=S.hoje||hojeISO();

function tecDe(id){var a=S.atr[String(id)];return a&&a.tecnico||'';}
function ehMeu(o){return semAcento(tecDe(o.id))===semAcento(S.tecnico);}
/* Marca (ou desmarca, no segundo toque) o técnico que vai fazer a entrega. */
function atribuir(ev,id,i){

/* nome vazio = tira o técnico do pedido. */
function atribuirNome(id,nome){
  var k=String(id);

  var o=(S.lista||[]).filter(function(x){return String(x.id)===k;})[0]||{};
  var d={tecnico:nome||'',por:S.tecnico,em:Date.now(),numero:o.numero||'',dataPrevista:o.dataPrevista||''};
  S.atr[k]=Object.assign({},S.atr[k]||{},d);

/* Tempo de serviço estimado do pedido (minutos), marcado pelo comercial. */
var TEMPOS=[15,30,45,60];
function tempoDe(id){var a=S.atr[String(id)];return a&&a.tempo||0;}
function fmtTempo(m){return m>=60?(Math.floor(m/60)+'h'+(m%60?pad(m%60):'')):m+' min';}
function definirTempo(ev,id,m){
  ev.stopPropagation();
  if(m==='outro'){
    var r=prompt('Tempo estimado do serviço, em minutos (ex.: 90):',tempoDe(id)||'');
    if(r==null)return;m=parseInt(r,10);
    if(!(m>0&&m<=480)){toast('Informe um tempo entre 1 e 480 minutos');return;}
  }
  if(tempoDe(id)===m)m=0; /* segundo toque desmarca */
  var k=String(id),o=(S.lista||[]).filter(function(x){return String(x.id)===k;})[0]||{};
  S.atr[k]=Object.assign({},S.atr[k]||{},{tempo:m});
  db.collection(C_ATR).doc(k).set({tempo:m,numero:o.numero||'',dataPrevista:o.dataPrevista||'',em:(S.atr[k].em||Date.now())},{merge:true}).catch(function(e){toast('Erro: '+e.message);});
  desenharItens();
}

function idsAssinados(){return Object.keys(S.reg).filter(function(id){return!!S.reg[id].assinatura;});}

function idsAEnviar(){return idsAssinados().filter(function(id){var e=S.reg[id].envio;return!(e&&e.ok);});}

function idsVendas(){return Object.keys(S.reg).filter(function(id){return(S.reg[id].vendas||[]).length;});}
function vendaSemPreco(r){return(r.vendas||[]).some(function(v){return!(v.preco>0);});}

/* Concluído = relatório gerado (o cliente assinou). */

function statusReg(id){
  var r=S.reg[String(id)];

/* ═══ Serviços por técnico (relatório do comercial) ════════════════════════
   Conta os atendimentos concluídos (relatório assinado) no mês, por técnico.
   Cada atendimento (um pedido, quase sempre um aparelho) conta uma vez só,
   no serviço principal: instalação purificador > instalação FC > carga FC > higienização >
   sem água > vazamento > visita técnica > refil > outro.
   Ex.: refil + higienização conta como higienização, sem somar o refil. */
var CATEGORIAS=[
  {k:'inst_purif',l:'Instalação purificador'},
  {k:'inst_fc',l:'Instalação FC'},
  {k:'carga_fc',l:'Carga FC'},
  {k:'hig',l:'Higienização'},
  {k:'semagua',l:'Visita Técnica (Sem água)'},
  {k:'vazamento',l:'Visita Técnica (Vazamento)'},
  {k:'visita',l:'Visita Técnica (Geral)'},
  {k:'refil',l:'Troca/entrega de refil'},
  {k:'outro',l:'Outro'}
];
/* Purificador e Filtro Central (FC) são aparelhos distintos: o atendimento
   conta uma vez no serviço principal de cada um (no FC: instalação › carga).
   Ex.: instalação purificador + instalação FC conta 1 em cada coluna. */
var CAT_FC=['inst_fc','carga_fc'];
/* Carga de filtro central é Carga FC, nunca troca de refil: se o técnico marcou
   "Troca de refil" e o pedido tem carga de FC, conta como Carga FC (o refil só
   continua se o pedido também tiver outro refil/elemento). */
var RE_CARGA_FC=/CARGA\s+(DE\s+)?(FILTRO\s+CENTRAL|FC)\b/i,RE_REFIL=/REFIL|ELEMENTO|CARBON|CARV[AÃ]O|\bPP\b|\bVELA/i;
function itensDe(r){return((r&&r.pedido&&r.pedido.itens)||[]).map(function(i){return String(i.descricao||'');});}
function temCargaFc(r){return itensDe(r).some(function(d){return RE_CARGA_FC.test(d);});}
function tiposContagem(ap,r){
  var t=tiposDe(ap).slice(),i=t.indexOf('refil');
  if(i>=0&&temCargaFc(r)){
    if(t.indexOf('carga_fc')<0)t.push('carga_fc');
    if(!itensDe(r).some(function(d){return!RE_CARGA_FC.test(d)&&RE_REFIL.test(d);}))t.splice(t.indexOf('refil'),1);
  }
  return t;
}
/* Cada aparelho do atendimento conta separado (2 aparelhos higienizados = 2). */
function categoriasDe(r){
  var out=[];
  aparelhosDe(r).forEach(function(ap){
    var t=tiposContagem(ap,r);
    [CATEGORIAS.filter(function(c){return CAT_FC.indexOf(c.k)<0;}),CATEGORIAS.filter(function(c){return CAT_FC.indexOf(c.k)>=0;})]
      .forEach(function(grupo){for(var i=0;i<grupo.length;i++)if(t.indexOf(grupo[i].k)>=0){out.push(grupo[i].k);return;}});
  });
  return out.length?out:['_sem'];
}
function nomesCat(r){
  var c={},ord=[];
  categoriasDe(r).forEach(function(k){if(!c[k]){c[k]=0;ord.push(k);}c[k]++;});
  return ord.map(function(k){return(c[k]>1?c[k]+'× ':'')+tipoNome(k);}).join(' + ');
}
var REL={mes:''};
function mesAtual(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1);}
function mesMais(m,n){var p=m.split('-').map(Number),d=new Date(p[0],p[1]-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1);}
var MESES_NOME=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function nomeMes(m){var p=m.split('-');return MESES_NOME[Number(p[1])-1]+' de '+p[0];}
function abrirRelatorio(){
  document.body.classList.remove('largo');

function mudarMes(n){REL.mes=mesMais(REL.mes,n);carregarRelatorio();}
async function carregarRelatorio(){
  REL.carregando=true;REL.erro='';renderRelatorio();
  var p=REL.mes.split('-').map(Number),ini=new Date(p[0],p[1]-1,1).getTime(),fim=new Date(p[0],p[1],1).getTime(),mes=REL.mes;
  try{
    var snap=await db.collection(C_REG).where('assinatura.em','>=',ini).where('assinatura.em','<',fim).get();
    if(mes!==REL.mes)return;
    REL.itens=snap.docs.map(function(d){var r=d.data();r.id=d.id;return r;})
      .filter(function(r){return r.assinatura&&r.assinatura.em>=ini&&r.assinatura.em<fim;})
      .sort(function(a,b){return a.assinatura.em-b.assinatura.em;});
  }catch(e){REL.erro=e.message;REL.itens=[];}
  REL.carregando=false;
  if(S.tela==='rel')renderRelatorio();
}
/* Técnico do atendimento: o marcado para a entrega quando assinou; nos
   registros antigos, o marcado no pedido ou quem preencheu. */
function tecDoReg(r){return r.tecnicoEntrega||tecDe(r.id)||r.tecnico||'Sem técnico';}
function tipoNome(k){return k==='_sem'?'Sem tipo':(CATEGORIAS.filter(function(c){return c.k===k;})[0]||{l:k}).l;}
function tabelaRel(){
  var por={},tot={_n:0};
  (REL.itens||[]).forEach(function(r){
    var t=tecDoReg(r),l=por[t]=por[t]||{_n:0};l._n++;tot._n++;
    categoriasDe(r).forEach(function(k){l[k]=(l[k]||0)+1;tot[k]=(tot[k]||0)+1;});
  });
  var cols=CATEGORIAS.map(function(c){return c.k;});if(tot._sem)cols.push('_sem');
  var nomes=S.tecsRua.slice();Object.keys(por).forEach(function(n){if(nomes.indexOf(n)<0)nomes.push(n);});
  return{por:por,tot:tot,cols:cols,nomes:nomes};
}

  if(REL.carregando){$('app').innerHTML=h+'<div class="empty"><span class="spin"></span> Contando…</div>';return;}
  if(REL.erro)h+='<div class="err">Não foi possível ler os atendimentos: '+esc(REL.erro)+'</div>';
  var t=tabelaRel(),nomeCol=tipoNome;
  h+='<div class="card tw"><table class="rel-t"><thead><tr><th>Técnico</th>'+t.cols.map(function(k){return'<th>'+esc(nomeCol(k))+'</th>';}).join('')+'<th>Atendimentos</th></tr></thead><tbody>'
    +t.nomes.map(function(n){var l=t.por[n]||{_n:0};return'<tr><td>👷 '+esc(n)+'</td>'+t.cols.map(function(k){return'<td class="'+(l[k]?'':'z')+'">'+(l[k]||0)+'</td>';}).join('')+'<td><b>'+l._n+'</b></td></tr>';}).join('')
    +'<tr class="tot"><td>Total</td>'+t.cols.map(function(k){return'<td>'+(t.tot[k]||0)+'</td>';}).join('')+'<td>'+t.tot._n+'</td></tr></tbody></table>'
    +'<div class="actions"><button class="btn btn-g" onclick="baixarRelatorio()"'+((REL.itens||[]).length?'':' disabled')+'>⬇ Baixar planilha</button></div></div>';
  if((REL.itens||[]).length){
    h+='<div class="card"><div class="sec">Atendimentos do mês ('+REL.itens.length+')</div>'
      +REL.itens.map(function(r){return'<div style="padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer;" onclick="abrirPedido('+Number(r.id)+')">'
        +'<b>'+esc(r.numero||'')+'</b> · '+esc(r.cliente||'')+' <span class="sub">· '+fmtDH(r.assinatura.em)+'</span>'
        +'<div class="sub">👷 '+esc(tecDoReg(r))+' · '+esc(nomeTiposTodos(r)||'sem tipo marcado')+' → <b>'+esc(nomesCat(r))+'</b></div></div>';}).join('')+'</div>';
  }else if(!REL.erro)h+='<div class="empty">Nenhum atendimento concluído em '+nomeMes(REL.mes)+'.</div>';
  $('app').innerHTML=h;

/* Planilha (CSV, abre no Excel): o resumo e, abaixo, cada atendimento. */
function baixarRelatorio(){
  var t=tabelaRel(),q=function(v){return'"'+String(v==null?'':v).replace(/"/g,'""')+'"';},L=[];
  var nomeCol=tipoNome;
  L.push([q('Serviços por técnico — '+nomeMes(REL.mes))].join(';'));
  L.push([q('Técnico')].concat(t.cols.map(function(k){return q(nomeCol(k));})).concat([q('Atendimentos')]).join(';'));
  t.nomes.forEach(function(n){var l=t.por[n]||{_n:0};L.push([q(n)].concat(t.cols.map(function(k){return l[k]||0;})).concat([l._n]).join(';'));});
  L.push([q('Total')].concat(t.cols.map(function(k){return t.tot[k]||0;})).concat([t.tot._n]).join(';'));
  L.push('');L.push(['Data','Pedido','Cliente','Técnico','Serviços marcados','Contado como','Pagamento'].map(q).join(';'));
  (REL.itens||[]).forEach(function(r){
    var pg=r.pagamento||{},pag=pg.feito==='Sim'?(pg.forma||'')+(pg.parcelas&&pg.parcelas!=='À vista'?' '+pg.parcelas:''):pg.feito==='Não'?'Não pago no local':'';
    L.push([fmtDH(r.assinatura.em),r.numero,r.cliente,tecDoReg(r),nomeTiposTodos(r),nomesCat(r),pag].map(q).join(';'));
  });
  var blob=new Blob(['﻿'+L.join('\r\n')],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='servicos-por-tecnico-'+REL.mes+'.csv';
  document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href);},5000);
}

/* ═══ Adiar a entrega ════════════════════════════════════════════════════
   Muda a data prevista do pedido no Bling (o servidor anota nas observações
   internas quem adiou e por quê) e guarda o histórico em campo_atribuicoes. */
function pedidoDaLista(id){return(S.lista||[]).filter(function(x){return String(x.id)===String(id);})[0]||(S.ped&&String(S.ped.id)===String(id)?S.ped:null);}
function adiarPedido(id){
  var o=pedidoDaLista(id)||{id:id},atual=prev(o)||'';
  var base=atual&&atual>(S.hoje||hojeISO())?atual:(S.hoje||hojeISO());
  function mais(d,n){var x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate());}
  var amanha=mais(S.hoje||hojeISO(),1),ops=[[amanha,'Amanhã'],[mais(S.hoje||hojeISO(),2),'Depois de amanhã'],[mais(base,7),'+1 semana']];
  var ov=document.createElement('div');ov.className='mdl-ov';ov.id='adiar-ov';
  ov.onclick=function(e){if(e.target===ov)ov.remove();};
  ov.innerHTML='<div class="card"><h3>📅 Adiar entrega · pedido '+esc(o.numero||'')+'</h3>'
    +'<div class="sub" style="margin-bottom:10px;">'+esc(o.cliente&&o.cliente.nome||o.cliente||'')+' · entrega prevista para <b>'+(atual?fmtData(atual):'sem data')+'</b>. A nova data também é gravada no Bling.</div>'
    +'<div class="chips" style="flex-wrap:wrap;">'+ops.map(function(x){return'<button class="chip" onclick="$(\'ad-data\').value=\''+x[0]+'\'">'+x[1]+' ('+fmtData(x[0]).slice(0,5)+')</button>';}).join('')+'</div>'
    +'<div class="field"><label>Nova data de entrega <span class="req">*</span></label><input type="date" id="ad-data" min="'+amanha+'" value="'+amanha+'"/></div>'
    +'<div class="field"><label>Motivo <span class="req">*</span></label><textarea id="ad-motivo" rows="2" placeholder="Ex.: cliente pediu para outro dia, não havia ninguém no local…"></textarea></div>'
    +'<div class="actions"><button class="btn btn-g" onclick="$(\'adiar-ov\').remove()">Cancelar</button><button class="btn btn-p" id="ad-ok" onclick="confirmarAdiar('+id+')">Adiar entrega</button></div></div>';
  document.body.appendChild(ov);
}
async function confirmarAdiar(id){
  var data=val('ad-data'),motivo=val('ad-motivo'),o=pedidoDaLista(id)||{},de=prev(o)||'';
  if(!/^\d{4}-\d{2}-\d{2}$/.test(data)){toast('Escolha a nova data');return;}
  if(data<=(S.hoje||hojeISO())){toast('Escolha uma data a partir de amanhã');return;}
  if(!motivo){toast('Escreva o motivo');$('ad-motivo').focus();return;}
  var b=$('ad-ok');b.disabled=true;b.innerHTML='<span class="spin"></span> Gravando no Bling…';
  try{
    await api('/api/bling/campo/pedidos/'+id+'/data',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:data,motivo:motivo,por:S.tecnico})});
  }catch(e){b.disabled=false;b.textContent='Adiar entrega';alert('Não foi possível adiar:\n\n'+e.message);return;}
  var k=String(id),reg={de:de,para:data,motivo:motivo,por:S.tecnico,em:Date.now()};
  S.atr[k]=Object.assign({},S.atr[k]||{});S.atr[k].adiamentos=(S.atr[k].adiamentos||[]).concat([reg]);S.atr[k].dataPrevista=data;
  db.collection(C_ATR).doc(k).set({adiamentos:firebase.firestore.FieldValue.arrayUnion(reg),dataPrevista:data,numero:o.numero||'',em:Date.now()},{merge:true}).catch(function(){});
  if(o)o.dataPrevista=data;
  if(S.ped&&String(S.ped.id)===k)S.ped.dataPrevista=data;
  lsSet('campo_lista',JSON.stringify({em:Date.now(),hoje:S.hoje,lista:S.lista}));
  var ov=$('adiar-ov');if(ov)ov.remove();
  toast('Entrega adiada para '+fmtData(data)+' ✔');
  if(S.tela==='ped')renderPedido();else if(S.tela==='lista')desenharItens();else render();
}

/* ═══ Quadro do comercial ════════════════════════════════════════════════
   Coluna "A distribuir" (pedidos da data sem técnico) e uma coluna por
   técnico de rua. No computador, arrasta o pedido; no celular, toca no
   pedido e depois na coluna. Cada coluna monta ou mostra a rota do técnico. */
function kbCard(o){
  return'<div class="kb-c'+(S.kbSel===o.id?' sel':'')+(concluido(o.id)?' feito':'')+'" draggable="true" data-id="'+o.id+'" ondragstart="kbDrag(event,'+o.id+')" onclick="kbClique(event,'+o.id+')">'
    +'<div class="t">'+(o._rota?'<span class="ord" style="font-size:11px;">'+o._rota.n+'º '+esc(o._rota.h)+'</span> ':'')+esc(o.numero)+' · '+esc(o.cliente||'Cliente')+'</div>'
    +itensResumo(o)
    +tempoHtml(o)
    +'<div class="x"><span>'+(o.vendedor?esc(o.vendedor):'')+(o.total?' · '+money(o.total):'')+'</span><span>'+(concluido(o.id)?'':'<a href="#" onclick="event.stopPropagation();event.preventDefault();adiarPedido('+o.id+')">adiar</a> · ')+'<a href="#" onclick="event.stopPropagation();event.preventDefault();abrirPedido('+o.id+')">abrir</a></span></div>'
    +'<div class="badges">'+statusReg(o.id)+'</div></div>';
}
function quadroHtml(dia,doDia){
  var livres=doDia.filter(function(o){return!tecDe(o.id);});
  var cols=S.tecsRua.slice();doDia.forEach(function(o){var t=tecDe(o.id);if(t&&cols.indexOf(t)<0)cols.push(t);});
  var h='<div class="kb-dica">'+(S.kbSel?'<b>Pedido selecionado.</b> Toque na coluna do técnico (ou em "A distribuir") para mover. <a href="#" onclick="event.preventDefault();S.kbSel=null;desenharItens()">cancelar</a>'
    :'Arraste cada pedido para a coluna do técnico — no celular, toque no pedido e depois na coluna.')+'</div><div class="kb">';
  h+='<div class="kb-col livre" data-tec="" ondragover="kbSobre(event)" ondragleave="kbSai(event)" ondrop="kbSolta(event,\'\')" onclick="kbColuna(\'\')">'
    +'<div class="kb-h"><b>📥 A distribuir ('+livres.length+')</b><span class="sub">Entregas sem técnico</span></div><div class="kb-b">'
    +(livres.length?livres.map(kbCard).join(''):'<div class="kb-vazio">Tudo distribuído ✔</div>')+'</div></div>';
  cols.forEach(function(t,ci){
    var meus=doDia.filter(function(o){return tecDe(o.id)===t;});
    var ro=rotaDe(dia,t),res=ro&&ro.resultado,pos={};
    if(res)res.paradas.forEach(function(p,i){pos[p.id]={n:i+1,h:p.chegada};});
    meus.sort(function(a,b){return(pos[a.id]?pos[a.id].n:999)-(pos[b.id]?pos[b.id].n:999);});
    meus.forEach(function(o){o._rota=pos[o.id]||null;});
    var ids=meus.map(function(o){return o.id;}).sort().join(','),idsR=res?res.paradas.map(function(p){return p.id;}).concat(res.naoLocalizados.map(function(p){return p.id;})).sort().join(','):'';
    var tj=JSON.stringify(t).replace(/"/g,'&quot;');
    h+='<div class="kb-col" data-tec="'+esc(t)+'" ondragover="kbSobre(event)" ondragleave="kbSai(event)" ondrop="kbSolta(event,'+tj+')" onclick="kbColuna('+tj+')">'
      +'<div class="kb-h"><b>👷 '+esc(t)+' ('+meus.length+')</b>'
      +'<div class="kb-r" onclick="event.stopPropagation()">'
      +(res?(ids===idsR?'<span>🗺️ '+String(res.distanciaKm).replace('.',',')+' km · volta '+esc(res.volta)+'</span>':'<span style="color:var(--red)">⚠️ rota desatualizada</span>')
          +'<button class="btn btn-g" onclick="abrirRota(\''+esc(dia)+'\','+tj+')">Ver rota</button>'
          +(ids!==idsR&&meus.length?'<button class="btn btn-p" onclick="kbMontar('+tj+')">↻ Montar de novo</button>':'')
        :(meus.length?'<button class="btn btn-p" onclick="kbMontar('+tj+')">🗺️ Montar rota</button>':''))
      +'</div></div><div class="kb-b">'
      +(meus.length?meus.map(kbCard).join(''):'<div class="kb-vazio">Arraste entregas para cá</div>')+'</div></div>';
  });
  return h+'</div>';
}
var _kbArrasto=null;
function kbDrag(ev,id){_kbArrasto=id;try{ev.dataTransfer.setData('text/plain',String(id));ev.dataTransfer.effectAllowed='move';}catch(e){}}
function kbSobre(ev){ev.preventDefault();ev.currentTarget.classList.add('alvo');}
function kbSai(ev){ev.currentTarget.classList.remove('alvo');}
function kbSolta(ev,tec){
  ev.preventDefault();ev.stopPropagation();ev.currentTarget.classList.remove('alvo');
  var id=Number((ev.dataTransfer&&ev.dataTransfer.getData('text/plain'))||_kbArrasto);_kbArrasto=null;
  if(id){atribuirNome(id,tec);S.kbSel=null;desenharItens();}
}
function kbClique(ev,id){ev.stopPropagation();S.kbSel=S.kbSel===id?null:id;desenharItens();}
function kbColuna(tec){if(!S.kbSel)return;atribuirNome(S.kbSel,tec);S.kbSel=null;desenharItens();}
async function kbMontar(tec){
  var dia=S.filtro,ids=idsDoTecnico(dia,tec);if(!ids.length)return;
  toast('Montando a rota de '+tec+'…');
  try{await calcularRota(dia,tec,ids,ROTA_CFG.saida,ROTA_CFG.parada,false);toast('Rota de '+tec+' montada ✔');}
  catch(e){alert('Não foi possível montar a rota de '+tec+':\n\n'+e.message);}
  if(S.tela==='lista')desenharItens();
}

/* ═══ Rota do técnico ════════════════════════════════════════════════════
   O servidor localiza cada endereço do Bling no Google, a IA lê janelas de
   horário nas observações e sai a melhor ordem, da loja e de volta à loja.
   A rota fica salva em campo_rotas para o técnico ver no celular dele. */
function rotaId(dia,tec){return dia+'_'+semAcento(tec).replace(/[^a-z0-9]+/g,'-');}
function rotaDe(dia,tec){return S.rotas[rotaId(dia,tec)]||null;}
var ROTA_CFG={saida:lsGet('campo_saida')||'08:00',parada:Number(lsGet('campo_parada'))||20};
function rotaPainel(tec,dia,lista){
  var ro=rotaDe(dia,tec),res=ro&&ro.resultado,h='<div class="card rp" onclick="event.stopPropagation()">';
  if(!res&&ehTec())return h+'<div class="sec" style="margin:0 0 4px;">🗺️ Sua rota · '+esc(rotuloDia(dia))+'</div><div class="sub">O comercial ainda não montou a sua rota. Siga a lista abaixo.</div></div>';
  if(res){
    var ids=lista.map(function(o){return o.id;}).sort().join(','),idsR=res.paradas.map(function(p){return p.id;}).concat(res.naoLocalizados.map(function(p){return p.id;})).sort().join(',');
    h+='<div class="sec" style="margin:0 0 4px;">🗺️ '+(ehTec()?'Sua rota':'Rota de '+esc(tec))+' · '+esc(rotuloDia(dia))+'</div>'
      +'<div class="rp-res"><span><b>'+res.paradas.length+'</b> paradas</span><span><b>'+String(res.distanciaKm).replace('.',',')+'</b> km</span>'
      +'<span>saída <b>'+esc(res.saida)+'</b></span><span>volta à loja <b>'+esc(res.volta)+'</b></span></div>'
      +(ids!==idsR?'<div class="err" style="margin-bottom:8px;">'+(ehTec()?'Suas entregas mudaram depois que a rota foi montada. Peça ao comercial para montar de novo.':'As entregas de '+esc(tec)+' mudaram depois que a rota foi montada. Monte de novo.')+'</div>':'')
      +(res.naoLocalizados.length?'<div class="err" style="margin-bottom:8px;">'+res.naoLocalizados.length+' pedido(s) fora da rota: endereço não encontrado.</div>':'')
      +'<div class="actions"><button class="btn btn-p" onclick="abrirRota(\''+esc(dia)+'\',\''+esc(tec).replace(/'/g,"\\'")+'\')">Ver rota no mapa</button>'
      +(ehTec()?'':'<button class="btn btn-g" onclick="montarRota()">↻ Montar de novo</button>')+'</div>'
      +'<div class="sub" style="margin-top:6px;">Montada por '+esc(ro.por||'-')+' em '+fmtDH(ro.em)+(res.manual?' · ordem ajustada à mão':'')+'</div>';
  }else{
    h+='<div class="sec" style="margin:0 0 8px;">🗺️ Rota de '+esc(tec)+' · '+esc(rotuloDia(dia))+'</div>'
      +'<div class="g2"><div class="field"><label>Saída da loja</label><input type="time" id="rp-saida" value="'+esc(ROTA_CFG.saida)+'"/></div>'
      +'<div class="field"><label>Tempo padrão por cliente (min)</label><input type="number" id="rp-parada" min="0" max="180" value="'+ROTA_CFG.parada+'"/></div></div>'
      +'<button class="btn btn-p btn-lg" id="rp-btn" onclick="montarRota()">🗺️ Montar a melhor rota ('+lista.length+' entrega'+(lista.length===1?'':'s')+')</button>'
      +'<div class="sub" style="margin-top:6px;">Sai da loja, passa por todos os endereços na melhor ordem e volta. Horários escritos nas observações do pedido (ex.: "só à tarde") são respeitados.</div>';
  }
  return h+'</div>';
}
function idsDoTecnico(dia,tec){return(S.lista||[]).filter(function(o){return prev(o)===dia&&tecDe(o.id)===tec;}).map(function(o){return o.id;});}
async function calcularRota(dia,tec,ids,saida,parada,manual){
  var res=await api('/api/bling/campo/rota',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({pedidos:ids,dia:dia,saida:saida,parada:parada,manterOrdem:!!manual,
      tempos:ids.reduce(function(m,id){var t=tempoDe(id);if(t)m[id]=t;return m;},{})})});
  var doc={dia:dia,tecnico:tec,por:S.tecnico,em:Date.now(),resultado:res};
  S.rotas[rotaId(dia,tec)]=doc;
  db.collection(C_ROTA).doc(rotaId(dia,tec)).set(doc).catch(function(e){toast('Rota não salva: '+e.message);});
  return doc;
}
/* Aba "Todos": situação da rota de cada técnico e um botão para montar todas. */
function painelTodas(dia,doDia){
  var tecs={};doDia.forEach(function(o){var t=tecDe(o.id);if(t)tecs[t]=(tecs[t]||0)+1;});
  var nomes=Object.keys(tecs).sort();if(!nomes.length)return'';
  var faltam=nomes.filter(function(t){return!rotaDe(dia,t);});
  return'<div class="card rp" onclick="event.stopPropagation()"><div class="sec" style="margin:0 0 6px;">🗺️ Rotas de '+esc(rotuloDia(dia))+'</div>'
    +nomes.map(function(t){var ro=rotaDe(dia,t),res=ro&&ro.resultado;
      return'<div style="margin-bottom:4px;font-size:13px;">👷 <b>'+esc(t)+'</b> · '+tecs[t]+' entrega'+(tecs[t]===1?'':'s')+' · '
        +(res?'✅ rota montada ('+String(res.distanciaKm).replace('.',',')+' km, volta '+esc(res.volta)+')':'<span style="color:var(--amber)">sem rota</span>')+'</div>';}).join('')
    +'<div class="g2" style="margin-top:8px;"><div class="field"><label>Saída da loja</label><input type="time" id="rt-saida" value="'+esc(ROTA_CFG.saida)+'"/></div>'
    +'<div class="field"><label>Tempo padrão por cliente (min)</label><input type="number" id="rt-parada" min="0" max="180" value="'+ROTA_CFG.parada+'"/></div></div>'
    +'<button class="btn btn-p btn-lg" id="rt-btn" onclick="montarTodas('+(faltam.length?'false':'true')+')">'+(faltam.length?'🗺️ Montar as rotas que faltam ('+faltam.length+')':'↻ Montar todas de novo ('+nomes.length+')')+'</button>'
    +'<div class="sub" style="margin-top:6px;">Cada técnico recebe a sua rota, saindo da loja e voltando. Entregas sem técnico marcado ficam de fora.</div></div>';
}
async function montarTodas(todas){
  var dia=S.filtro,saida=val('rt-saida')||ROTA_CFG.saida,parada=Number(val('rt-parada'))||0;
  ROTA_CFG={saida:saida,parada:parada};lsSet('campo_saida',saida);lsSet('campo_parada',String(parada));
  var tecs={};(S.lista||[]).forEach(function(o){var t=tecDe(o.id);if(t&&prev(o)===dia)tecs[t]=1;});
  var nomes=Object.keys(tecs).sort().filter(function(t){return todas||!rotaDe(dia,t);}),erros=[];
  for(var i=0;i<nomes.length;i++){
    var btn=$('rt-btn');if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span> Montando a rota de '+esc(nomes[i])+' ('+(i+1)+' de '+nomes.length+')…';}
    try{await calcularRota(dia,nomes[i],idsDoTecnico(dia,nomes[i]),saida,parada,false);}
    catch(e){erros.push(nomes[i]+': '+e.message);}
  }
  if(erros.length)alert('Algumas rotas não foram montadas:\n\n'+erros.join('\n'));
  else toast('Rotas montadas ✔');
  if(S.tela==='lista')desenharItens();
}
async function montarRota(ordemManual){
  var tec=ordemManual?S.rota.tecnico:S.aba,dia=ordemManual?S.rota.dia:S.filtro;
  var antiga=rotaDe(dia,tec),saida=$('rp-saida')?val('rp-saida'):(antiga&&antiga.resultado.saida)||ROTA_CFG.saida;
  var parada=$('rp-parada')?Number(val('rp-parada'))||0:(antiga&&antiga.resultado.parada)||ROTA_CFG.parada;
  ROTA_CFG={saida:saida,parada:parada};lsSet('campo_saida',saida);lsSet('campo_parada',String(parada));
  var ids=ordemManual||idsDoTecnico(dia,tec);
  if(!ids.length){toast('Nenhuma entrega marcada para '+tec);return;}
  var btn=$('rp-btn')||$('rr-btn');if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span> Montando a rota… (pode levar até 1 minuto)';}
  if(!ordemManual&&!$('rp-btn'))toast('Montando a rota…');
  try{
    await calcularRota(dia,tec,ids,saida,parada,!!ordemManual);
    abrirRota(dia,tec,!!ordemManual);
  }catch(e){
    alert('Não foi possível montar a rota:\n\n'+e.message);
    if(btn){btn.disabled=false;btn.textContent='Tentar de novo';}
  }
}
function abrirRota(dia,tec,substituir){
  var ro=rotaDe(dia,tec);if(!ro)return;
  S.rota={dia:dia,tecnico:tec,ordem:ro.resultado.paradas.slice(),alterada:false};
  document.body.classList.remove('largo');
  if(S.tela!=='rota'){S.tela='rota';if(!substituir)history.pushState({rota:1},'');}
  window.scrollTo(0,0);renderRota();
}
function moverParada(i,d){
  var o=S.rota.ordem,j=i+d;if(j<0||j>=o.length)return;
  var x=o[i];o[i]=o[j];o[j]=x;S.rota.alterada=true;renderRota();
}
function navUrl(p){return'https://www.google.com/maps/dir/?api=1&destination='+p.lat+','+p.lng+'&travelmode=driving';}
/* Link do Google Maps com a rota inteira. O link aceita até 9 paradas
   intermediárias: rota maior sai em partes, cada uma emendando na anterior. */
function linksGoogle(res,ordem){
  var pts=[{lat:res.loja.lat,lng:res.loja.lng}].concat(ordem).concat([{lat:res.loja.lat,lng:res.loja.lng}]),links=[];
  for(var i=0;i<pts.length-1;i+=10){
    var trecho=pts.slice(i,Math.min(i+11,pts.length));
    var u='https://www.google.com/maps/dir/?api=1&travelmode=driving&origin='+trecho[0].lat+','+trecho[0].lng
      +'&destination='+trecho[trecho.length-1].lat+','+trecho[trecho.length-1].lng;
    var meio=trecho.slice(1,-1);
    if(meio.length)u+='&waypoints='+meio.map(function(p){return p.lat+','+p.lng;}).join('%7C');
    links.push(u);
  }
  return links;
}
function renderRota(){
  var r=S.rota,ro=rotaDe(r.dia,r.tecnico),res=ro.resultado;
  $('top').innerHTML='<button class="back" onclick="history.back()">‹</button><h1>Rota · '+esc(r.tecnico)+'</h1>'+whoBtn();
  var links=linksGoogle(res,r.ordem);
  var h='<div class="card"><div class="sec" style="margin:0 0 4px;">'+esc(rotuloDia(r.dia))+' · '+fmtData(r.dia)+'</div>'
    +'<div class="rp-res"><span><b>'+res.paradas.length+'</b> paradas</span><span><b>'+String(res.distanciaKm).replace('.',',')+'</b> km</span>'
    +'<span>~<b>'+Math.floor(res.duracaoMin/60)+'h'+pad(res.duracaoMin%60)+'</b> dirigindo</span>'
    +'<span>saída <b>'+esc(res.saida)+'</b> · volta <b>'+esc(res.volta)+'</b></span></div>'
    +links.map(function(u,i){return'<a class="btn btn-ok btn-lg" style="margin-top:6px;text-decoration:none;" target="_blank" rel="noopener" href="'+u+'">🧭 Abrir no Google Maps'+(links.length>1?' — parte '+(i+1)+' de '+links.length:'')+'</a>';}).join('')
    +'</div><div id="rmapa"></div>';
  if(r.alterada)h+='<div class="info">Você mudou a ordem. <button class="btn btn-p btn-sm" id="rr-btn" onclick="recalcularRota()">Recalcular horários com esta ordem</button></div>';
  h+='<div class="card">'+r.ordem.map(function(p,i){
    var jan=p.janela?(p.janela.nota||((p.janela.inicio?'a partir de '+p.janela.inicio:'')+(p.janela.fim?' até '+p.janela.fim:''))):'';
    return'<div class="st" style="'+(i?'border-top:1px solid var(--border);padding-top:10px;margin-top:10px;':'')+'">'
      +'<div class="n"'+(concluido(p.id)?' style="background:var(--green)" title="Concluído"':p.atrasado?' style="background:var(--red)"':'')+'>'+(concluido(p.id)?'✓':(i+1))+'</div>'

var LEAFLET_JS='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js',LEAFLET_CSS='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css',_leafP=null;
function carregarLeaflet(){
  if(window.L)return Promise.resolve();
  if(_leafP)return _leafP;
  _leafP=new Promise(function(ok,fail){
    var c=document.createElement('link');c.rel='stylesheet';c.href=LEAFLET_CSS;document.head.appendChild(c);
    var sc=document.createElement('script');sc.src=LEAFLET_JS;sc.onload=function(){ok();};
    sc.onerror=function(){_leafP=null;fail(new Error('Não foi possível carregar o mapa'));};document.head.appendChild(sc);
  });
  return _leafP;
}
/* Linha da rota no formato do Google (encoded polyline). */
function decodePolyline(s){
  var pts=[],i=0,lat=0,lng=0;
  while(i<s.length){
    var b,sh=0,r=0;do{b=s.charCodeAt(i++)-63;r|=(b&31)<<sh;sh+=5;}while(b>=32);lat+=(r&1)?~(r>>1):(r>>1);
    sh=0;r=0;do{b=s.charCodeAt(i++)-63;r|=(b&31)<<sh;sh+=5;}while(b>=32);lng+=(r&1)?~(r>>1):(r>>1);
    pts.push([lat/1e5,lng/1e5]);
  }
  return pts;
}
var _mapaRota=null;
function desenharMapaRota(res,ordem){
  carregarLeaflet().then(function(){
    var el=$('rmapa');if(!el)return;
    if(_mapaRota){_mapaRota.remove();_mapaRota=null;}
    var m=L.map(el);_mapaRota=m;
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(m);
    var lim=[[res.loja.lat,res.loja.lng]];
    if(res.polyline&&!S.rota.alterada){var ll=decodePolyline(res.polyline);L.polyline(ll,{color:'#0c85aa',weight:5,opacity:.85}).addTo(m);lim=lim.concat(ll);}
    else L.polyline([[res.loja.lat,res.loja.lng]].concat(ordem.map(function(p){return[p.lat,p.lng];})).concat([[res.loja.lat,res.loja.lng]]),{color:'#0c85aa',weight:3,dashArray:'6 8'}).addTo(m);
    L.marker([res.loja.lat,res.loja.lng],{icon:L.divIcon({className:'',html:'<div class="pin loja">🏠</div>',iconSize:[28,28],iconAnchor:[14,14]})}).bindPopup('<b>Loja</b><br>Saída '+esc(res.saida)+' · volta '+esc(res.volta)).addTo(m);
    ordem.forEach(function(p,i){
      lim.push([p.lat,p.lng]);
      L.marker([p.lat,p.lng],{icon:L.divIcon({className:'',html:'<div class="pin'+(p.atrasado?' atr':'')+'">'+(i+1)+'</div>',iconSize:[28,28],iconAnchor:[14,14]})})
        .bindPopup('<b>'+(i+1)+'. '+esc(p.cliente)+'</b><br>Pedido '+esc(p.numero)+(S.rota.alterada?'':'<br>Chegada '+esc(p.chegada))).addTo(m);
    });
    m.fitBounds(lim,{padding:[30,30]});
  }).catch(function(e){var el=$('rmapa');if(el)el.innerHTML='<div class="err">'+esc(e.message)+'</div>';});
}

function regAtual(){return S.ped&&S.reg[String(S.ped.id)]||{};}
async function abrirPedido(id){
  document.body.classList.remove('largo');
  S.editando=false;
  S.tela='ped';S.ped={id:id,_carregando:true};S.pedErr='';S.midias=[];
  window.scrollTo(0,0);renderPedido();
  history.pushState({ped:id},'');
  try{
    var o=await api('/api/bling/campo/pedidos/'+id);
    if(S.tela!=='ped'||S.ped.id!==id)return;
    S.ped=o;
  }catch(e){
    /* Sem sinal: abre com o que ficou salvo no aparelho, se houver. */
    var r=S.reg[String(id)];
    if(r&&r.pedido){S.ped=r.pedido;S.pedErr='Sem conexão com o Bling — mostrando os dados salvos no aparelho.';}
    else{S.pedErr=e.message;S.ped={id:id};}
  }
  try{
    var snap=await db.collection(C_MID).where('pedidoId','==',String(id)).get();
    S.midias=snap.docs.map(function(d){var m=d.data();m.id=d.id;return m;}).sort(function(a,b){return(a.criadoEm||0)-(b.criadoEm||0);});
  }catch(e){}
  if(S.tela==='ped'&&S.ped.id===id)renderPedido();
}

function totalVendas(r){return(r.vendas||[]).reduce(function(t,v){return t+(v.preco>0?v.preco*(v.qtd||1):0);},0);}
function vendasHtml(r){

  vs.forEach(function(v){
    var q=v.qtd||1;
    h+='<div class="vd-it"><div class="vd-d"><b>'+q+'×</b> '+esc(v.desc)
      +'<div class="sub">'+esc(v.por||'-')+' · '+fmtDH(v.em)+(v.obs?' · '+esc(v.obs):'')+(com&&v.preco>0&&q>1?' · total '+money(v.preco*q):'')+(com&&v.precoPor?' · preço por '+esc(v.precoPor):'')+'</div></div>'
      +(com?'<input inputmode="decimal" placeholder="R$ unit." title="Preço unitário" value="'+(v.preco>0?v.preco.toFixed(2).replace('.',','):'')+'" onchange="precoVenda(\''+v.id+'\',this.value)"/>'
        :'<span class="sub">'+(v.preco>0?'✔ preço ok':'aguardando preço')+'</span>')
      +(com||!(v.preco>0)?'<button class="x2" title="Remover" onclick="rmVenda(\''+v.id+'\')">✕</button>':'')+'</div>';
  });
  if(com&&vs.length)h+='<div style="text-align:right;margin-top:8px;font-size:14px;">'
    +(vendaSemPreco(r)?'<span class="badge b-amber">falta preço</span> ':'')+'<b>Total das vendas '+money(totalVendas(r))+'</b></div>';
  h+='<div class="vd-add"><input id="vd-desc" placeholder="O que foi vendido? Ex.: mangueira, refil extra"/>'
    +'<input id="vd-qtd" type="number" min="1" step="1" value="1" style="width:70px;" aria-label="Quantidade"/></div>'
    +'<input id="vd-obs" placeholder="Observação (opcional)" style="margin-top:6px;font-size:14px;"/>'
    +'<button class="btn btn-g" style="width:100%;margin-top:8px;" onclick="addVenda()">➕ Registrar venda</button></div>';

function gravarVendas(vs){
  var o=S.ped,id=String(o.id),y=window.scrollY;
  var d={vendas:vs,atualizadoEm:Date.now(),blingId:o.id,numero:o.numero||'',cliente:(o.cliente&&o.cliente.nome)||'',total:o.total||0};
  if(!(S.reg[id]&&S.reg[id].pedido))d.pedido=o;
  S.reg[id]=Object.assign({},S.reg[id]||{},d);
  db.collection(C_REG).doc(id).set(d,{merge:true}).catch(function(e){toast('Venda não salva: '+e.message);});
  renderPedido();window.scrollTo(0,y);
}
function addVenda(){
  var desc=val('vd-desc'),qtd=Math.max(1,Math.round(Number(val('vd-qtd'))||1));
  if(!desc){toast('Escreva o que foi vendido');$('vd-desc').focus();return;}
  var vs=(regAtual().vendas||[]).concat([{id:'v'+Date.now().toString(36),desc:desc,qtd:qtd,obs:val('vd-obs'),por:S.tecnico,em:Date.now()}]);
  gravarVendas(vs);toast('Venda registrada ✔');
}
function rmVenda(id){
  if(!confirm('Remover esta venda?'))return;
  gravarVendas((regAtual().vendas||[]).filter(function(v){return v.id!==id;}));
}
function lerPreco(t){
  t=String(t||'').replace(/[^\d,.]/g,'');
  if(t.indexOf(',')>=0)t=t.replace(/\./g,'').replace(',','.');
  var n=Math.round(Number(t)*100)/100;return n>0?n:0;
}
function precoVenda(id,txt){
  var n=lerPreco(txt);
  gravarVendas((regAtual().vendas||[]).map(function(v){
    if(v.id!==id)return v;
    var x=Object.assign({},v);x.preco=n;x.precoPor=S.tecnico;x.precoEm=Date.now();return x;
  }));
  if(txt&&!n)toast('Preço inválido');
}

function rmAparelho(id){
  var fs=S.midias.filter(function(m){return/_/.test(m.grupo||'')&&String(m.grupo).split('_')[1]===id;});

  fs.forEach(function(m){db.collection(C_MID).doc(m.id).delete().catch(function(){});});
  S.midias=S.midias.filter(function(m){return fs.indexOf(m)<0;});
  salvarCampos({aparelhos:(regAtual().aparelhos||[]).filter(function(a){return a.id!==id;})});
  var y=window.scrollY;renderPedido();window.scrollTo(0,y);

/* ═══ Fotos ══════════════════════════════════════════════════════════════
   Reduzidas no aparelho (1024px, JPEG) e gravadas uma por documento no
   Firestore: leves o bastante para o PDF ir pelo WhatsApp. */
function compressImg(file){
  return new Promise(function(ok,fail){
    var r=new FileReader();
    r.onerror=function(){fail(new Error('Não foi possível ler a imagem'));};
    r.onload=function(ev){
      var img=new Image();
      img.onerror=function(){fail(new Error('Formato de imagem não suportado'));};
      img.onload=function(){
        var M=1024,w=img.width,h=img.height;
        if(w>M||h>M){if(w>h){h=Math.round(h*M/w);w=M;}else{w=Math.round(w*M/h);h=M;}}
        var c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        ok({data:c.toDataURL('image/jpeg',0.68),w:w,h:h});
      };
      img.src=ev.target.result;
    };
    r.readAsDataURL(file);
  });
}
/* Grava as fotos de um grupo de uma vez (uma por documento no Firestore). */
function guardarFotos(grupo,lista){
  if(!lista.length)return;
  var pedidoId=String(S.ped.id);
  lista.forEach(function(f){
    var m={pedidoId:pedidoId,grupo:grupo,data:f.data,w:f.w,h:f.h,criadoEm:Date.now(),tecnico:S.tecnico};
    var ref=db.collection(C_MID).doc();
    ref.set(m).catch(function(err){toast('Foto não salva: '+err.message);});
    m.id=ref.id;S.midias.push(m);
  });
  if(!S.reg[pedidoId])salvarCampos();
  if(S.tela==='ped'&&String(S.ped.id)===pedidoId)renderPedido();
  toast(lista.length+' foto'+(lista.length===1?'':'s')+' salva'+(lista.length===1?'':'s'));
}
function addFoto(camera,grupo){
  if(fotosDe(grupo).length>=MAX_FOTOS){toast('Máximo de '+MAX_FOTOS+' fotos');return;}
  /* Câmera dentro da página, como na Oficina: tira todas as fotos e grava
     tudo ao concluir. Abrir o app de câmera do celular podia fazer o
     navegador recarregar a página. */
  if(camera&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){abrirCamera(grupo);return;}
  escolherArquivos(camera,grupo);
}
function escolherArquivos(camera,grupo){
  var inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  if(camera)inp.capture='environment';else inp.multiple=true;
  inp.onchange=async function(e){
    var files=Array.prototype.slice.call(e.target.files||[]),lista=[],cabe=MAX_FOTOS-fotosDe(grupo).length;
    var st=$('foto-st-'+grupo);if(st)st.textContent='Preparando fotos…';
    for(var i=0;i<files.length&&lista.length<cabe;i++){try{lista.push(await compressImg(files[i]));}catch(err){toast(err.message);}}
    if(st)st.textContent='';
    guardarFotos(grupo,lista);
  };
  inp.click();
}
var CAM=null;
async function abrirCamera(grupo){
  var ov=document.createElement('div');ov.className='cam-full';ov.id='cam-full';
  ov.innerHTML='<div class="cam-info" id="cam-info">Abrindo a câmera…</div><video id="cam-v" autoplay playsinline muted></video><div class="cam-tira" id="cam-tira"></div>'
    +'<div class="cam-bar"><button class="btn btn-g" onclick="fecharCamera(false)">Cancelar</button>'
    +'<button class="cam-shot" id="cam-shot" aria-label="Tirar foto" onclick="capturarFoto()"></button>'
    +'<button class="btn btn-g" onclick="trocarCamera()">🔄</button></div>'
    +'<div class="cam-bar" style="padding-top:0;"><button class="btn btn-ok btn-lg" id="cam-ok" onclick="fecharCamera(true)">Concluir</button></div>';

async function ligarCamera(){
  if(!CAM)return;
  if(CAM.stream)CAM.stream.getTracks().forEach(function(t){t.stop();});
  try{
    CAM.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:CAM.face,width:{ideal:1920},height:{ideal:1080}},audio:false});
    var v=$('cam-v');v.srcObject=CAM.stream;await v.play().catch(function(){});
    infoCamera();
  }catch(e){
    /* Sem permissão ou sem câmera: volta para a câmera do celular. */
    var g=CAM.grupo,ja=CAM.fotos;fecharCamera(false);
    guardarFotos(g,ja);
    toast('Não consegui abrir a câmera aqui ('+(e.name||e.message)+'). Usando a câmera do celular.');

function camLivres(){return MAX_FOTOS-fotosDe(CAM.grupo).length-CAM.fotos.length;}
function infoCamera(){
  var el=$('cam-info');if(!el||!CAM)return;
  var g=GRUPOS_FOTO.filter(function(x){return x.k===CAM.grupo;})[0];
  el.textContent='Aparelho '+(g?g.l.toLowerCase():'')+' do serviço · '+CAM.fotos.length+' foto'+(CAM.fotos.length===1?'':'s')+' · cabem mais '+camLivres()+' · toque no botão branco para fotografar';
  var ok=$('cam-ok');if(ok)ok.textContent=CAM.fotos.length?'Concluir e salvar '+CAM.fotos.length+' foto'+(CAM.fotos.length===1?'':'s'):'Concluir';

function trocarCamera(){if(!CAM)return;CAM.face=CAM.face==='environment'?'user':'environment';ligarCamera();}
function capturarFoto(){
  var v=$('cam-v');if(!CAM||!v||!v.videoWidth)return;
  if(camLivres()<=0){toast('Máximo de '+MAX_FOTOS+' fotos');return;}
  var M=1024,w=v.videoWidth,h=v.videoHeight;
  if(w>M||h>M){if(w>h){h=Math.round(h*M/w);w=M;}else{w=Math.round(w*M/h);h=M;}}
  var c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(v,0,0,w,h);
  CAM.fotos.push({data:c.toDataURL('image/jpeg',0.68),w:w,h:h});
  var ov=$('cam-full');if(ov){ov.style.opacity='.4';setTimeout(function(){ov.style.opacity='';},120);}

/* salvar=true grava as fotos tiradas; Cancelar descarta (pergunta se houver). */
function fecharCamera(salvar){

   Tela cheia própria, com a página travada atrás (senão o dedo rola a tela
   em vez de desenhar). Na confirmação gravamos hora e GPS do aparelho. */
var SIG=null;

  if(!validarRelatorio())return;

  salvarCampos();

/* Confere os campos obrigatórios do relatório (avisa e rola até o que falta). */
function validarRelatorio(){
  var aps=aparelhosDe(regAtual()),fim=S.editando?' antes de salvar':' antes da assinatura';
  for(var j=0;j<aps.length;j++){
    var ap=aps[j],s=ap.suf,pre=aps.length>1?'Aparelho '+(j+1)+': ':'',tipos=tiposDe(ap);
    if(!tipos.length){toast(pre+'marque o tipo de serviço');$('tipos'+s).scrollIntoView({behavior:'smooth',block:'center'});return false;}
    if(tipos.indexOf('outro')>=0&&!val('tipo-outro'+s)){toast(pre+'escreva qual é o serviço');$('tipo-outro'+s).focus();return false;}
    var ativas=checkAtivo(tipos,j>0),ck=ckLer(s),falta=ativas.filter(function(q){return!ck[q.k]||!ck[q.k].r;});
    if(falta.length){
      toast(pre+(falta.length===1?'responda a pergunta '+(ativas.indexOf(falta[0])+1)+fim:'responda as perguntas '+falta.map(function(q){return ativas.indexOf(q)+1;}).join(', ')+fim));
      $('ck-'+falta[0].k+s).scrollIntoView({behavior:'smooth',block:'center'});return false;
    }
    var semFoto=GRUPOS_FOTO.filter(function(g){return!fotosDe(g.k+s).length;});
    if(semFoto.length){toast(pre+'falta '+semFoto.map(function(g){return rotuloFoto(g.k,ap).toLowerCase();}).join(' e '));$('fotos-'+semFoto[0].k+s).scrollIntoView({behavior:'smooth',block:'center'});return false;}
  }
  var pg=pagLer(),fp=pg&&pagFalta(pg);
  if(fp){toast(fp);$('pag').scrollIntoView({behavior:'smooth',block:'center'});return false;}
  if(!val('obs')){toast('Escreva as observações do técnico');$('obs').scrollIntoView({behavior:'smooth',block:'center'});$('obs').focus();return false;}
  if(!val('rec-nome')){toast('Preencha quem está recebendo/assinando');$('rec-nome').focus();return false;}
  return true;
}
function abrirAssinatura(nome){
  var ov=document.createElement('div');ov.className='sig-full';ov.id='sig-full';
  ov.innerHTML='<div class="sig-top"><div><b>Assinatura — '+esc(nome)+'</b><div class="sub">Pedido '+esc(S.ped.numero||'')+' · '+esc(S.ped.cliente&&S.ped.cliente.nome||'')+'</div></div>'
    +'<button class="mdl-x" onclick="fecharAssin()">✕</button></div>'
    +'<div class="sig-termo">'+esc(TERMO)+'</div>'
    +'<div class="sig-wrap"><canvas id="sig-cv"></canvas><span class="sig-ph" id="sig-ph">Assine aqui com o dedo</span></div>'
    +'<div class="sig-bar"><button class="btn btn-g" onclick="limparAssin()">Limpar</button>'
    +'<button class="btn btn-g" onclick="fecharAssin()">Cancelar</button>'
    +'<button class="btn btn-ok" id="sig-ok">✔ Confirmar</button></div>';
  ov.addEventListener('touchmove',function(e){e.preventDefault();},{passive:false});
  document.body.appendChild(ov);
  document.documentElement.style.overflow='hidden';document.body.style.overflow='hidden';
  initAssin();

}

  cv.width=Math.round(b.width*dpr);cv.height=Math.round(b.height*dpr);
  var ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
  ctx.lineWidth=2.6;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#111827';

  function marca(p){SIG.x0=Math.min(SIG.x0,p.x);SIG.y0=Math.min(SIG.y0,p.y);SIG.x1=Math.max(SIG.x1,p.x);SIG.y1=Math.max(SIG.y1,p.y);}
  function pt(e){var r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
  cv.onpointerdown=function(e){e.preventDefault();cv.setPointerCapture(e.pointerId);SIG.des=true;var p=pt(e);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+0.1,p.y+0.1);ctx.stroke();marca(p);

/* Recorta só a área desenhada e reduz para no máximo 600px. */
function lerAssin(){
  if(!SIG||SIG.vazio)return null;
  var d=SIG.dpr,m=12,sx=Math.max(0,(SIG.x0-m)*d),sy=Math.max(0,(SIG.y0-m)*d);
  var sw=Math.min(SIG.cv.width-sx,(SIG.x1-SIG.x0+2*m)*d),sh=Math.min(SIG.cv.height-sy,(SIG.y1-SIG.y0+2*m)*d);

/* GPS pedido ao abrir a tela de assinatura: até o cliente terminar, a posição
   já chegou. Sem permissão ou sem sinal, o pedido sai sem localização. */
var LOCAL=null,LOCAL_P=null;
function pegarLocal(){
  LOCAL=null;
  LOCAL_P=new Promise(function(ok){
    if(!navigator.geolocation)return ok();
    navigator.geolocation.getCurrentPosition(function(p){
      LOCAL={lat:p.coords.latitude,lng:p.coords.longitude,precisao:Math.round(p.coords.accuracy||0),em:p.timestamp||Date.now()};ok();
    },function(){ok();},{enableHighAccuracy:true,timeout:20000,maximumAge:120000});
  });
}
async function confirmarAssin(){
  var a=lerAssin();if(!a){toast('Peça para o cliente assinar no quadro.');return;}
  fecharAssin();

  if(!LOCAL&&LOCAL_P){toast('Registrando localização…');await Promise.race([LOCAL_P,new Promise(function(ok){setTimeout(ok,8000);})]);}
  await salvarCampos({assinatura:a,local:LOCAL||null,tecnicoEntrega:tecDe(S.ped.id)||S.tecnico}).catch(function(e){toast('Erro ao salvar: '+e.message);});
  if(LOCAL)gravarLocal(LOCAL,LOCAL.em,'assinatura',{pedido:S.ped.numero||'',cliente:(S.ped.cliente&&S.ped.cliente.nome)||''});
  renderPedido();
  toast('Relatório salvo ✔');
}
function desfazerAssin(){
  if(!confirm('Apagar a assinatura e colher de novo?'))return;
  var id=String(S.ped.id);
  if(S.reg[id]){delete S.reg[id].assinatura;delete S.reg[id].local;}
  db.collection(C_REG).doc(id).update({assinatura:firebase.firestore.FieldValue.delete(),local:firebase.firestore.FieldValue.delete(),atualizadoEm:Date.now()}).catch(function(){});
  renderPedido();
}

var JSPDF_URL='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
var _jspdfP=null;
function carregarJsPDF(){
  if(window.jspdf)return Promise.resolve();
  if(_jspdfP)return _jspdfP;
  _jspdfP=new Promise(function(ok,fail){
    var sc=document.createElement('script');sc.src=JSPDF_URL;
    sc.onload=function(){ok();};
    sc.onerror=function(){_jspdfP=null;fail(new Error('Não foi possível carregar o gerador de PDF. Verifique a internet.'));};
    document.head.appendChild(sc);
  });
  return _jspdfP;
}
var MESES_EXT=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function dataExtenso(d){return d.getDate()+' de '+MESES_EXT[d.getMonth()]+' de '+d.getFullYear();}
function pdfMarcaDagua(doc){
  try{
    var w=132,h=w*LOGO_RATIO;
    doc.saveGraphicsState();doc.setGState(new doc.GState({opacity:0.07}));
    doc.addImage(LOGO_PURIFIC,'PNG',(210-w)/2,(297-h)/2,w,h);
    doc.restoreGraphicsState();
  }catch(e){}
}
function pdfNovaPagina(doc){
  doc.addPage();
  try{doc.addImage(LOGO_PURIFIC,'PNG',14,9,34,34*LOGO_RATIO);}catch(e){}
  var a=PURIFIC.azul;
  doc.setDrawColor(a[0],a[1],a[2]);doc.setLineWidth(0.4);doc.line(14,21,196,21);
  doc.setTextColor(30,30,30);doc.setFont('helvetica','normal');doc.setFontSize(8.5);
  return 27;
}
function pdfCabecalho(doc,titulo,subtitulo,infos){
  var ML=14,MR=196,a=PURIFIC.azul,v=PURIFIC.verde;
  try{doc.addImage(LOGO_PURIFIC,'PNG',ML,10,48,48*LOGO_RATIO);}catch(e){}
  doc.setFont('helvetica','bold');doc.setFontSize(12.5);doc.setTextColor(a[0],a[1],a[2]);
  doc.text(titulo,MR,16,{align:'right'});
  doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.setTextColor(120,120,120);
  doc.text(subtitulo,MR,21,{align:'right'});
  doc.setTextColor(130,130,130);doc.setFontSize(7);
  doc.text(PURIFIC.nome+'  ·  CNPJ '+PURIFIC.cnpj,MR,25.5,{align:'right'});
  doc.setDrawColor(a[0],a[1],a[2]);doc.setLineWidth(0.6);doc.line(ML,29,MR,29);
  doc.setDrawColor(v[0],v[1],v[2]);doc.setLineWidth(0.6);doc.line(ML,29,ML+38,29);
  doc.setFillColor(240,247,250);doc.roundedRect(ML,33,MR-ML,13,1.5,1.5,'F');
  var colW=(MR-ML)/infos.length;
  for(var i=0;i<infos.length;i++){
    var x=ML+4+i*colW;
    doc.setFont('helvetica','bold');doc.setFontSize(6);doc.setTextColor(a[0],a[1],a[2]);
    doc.text(infos[i][0].toUpperCase(),x,38);
    doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(40,40,40);
    doc.text(doc.splitTextToSize(String(infos[i][1]||'-'),colW-6)[0],x,43);
  }
  doc.setTextColor(30,30,30);
  return 50;
}
function pdfRodape(doc,nowStr){

  for(var i=1;i<=pc;i++){

    doc.setFont('helvetica','bold');doc.setFontSize(7);doc.setTextColor(a[0],a[1],a[2]);
    doc.text(PURIFIC.nome+'  ·  CNPJ '+PURIFIC.cnpj,PW/2,284.5,{align:'center'});

    doc.setTextColor(165,165,165);doc.setFontSize(6);

  }
}

  }
  aps.forEach(function(ap,j){
    var tit=varios?tituloAp(ap,j)+' · ':'';
    if(tiposDe(ap).length){section(tit+'Serviço realizado');texto(nomeTipos(ap));}
    var ck=ap.checklist||{},ativas=checkAtivo(tiposDe(ap),j>0);
    if(ativas.some(function(q){return ck[q.k]&&ck[q.k].r;})){
      section(tit+'Verificações do técnico');
      ativas.forEach(function(q,i){
        var a=ck[q.k];if(!a||!a.r)return;
        var lq=doc.splitTextToSize((i+1)+'. '+q.p,MR-ML-4),la=doc.splitTextToSize(a.r+(a.obs?' — '+a.obs:''),MR-ML-10);
        chk((lq.length+la.length)*4.5+2);
        doc.setFont('helvetica','bold');doc.text(lq,ML+2,y);y+=lq.length*4.5;
        doc.setFont('helvetica','normal');doc.text(la,ML+8,y);y+=la.length*4.5+1.5;
      });
    }
    if(varios)fotosPdf(ap,tit);
  });
  var pg=r.pagamento;
  if(pg&&pg.feito){
    section('Pagamento');
    line('Pago no local',pg.feito==='Sim'?'Sim — '+(pg.forma||'-')+(pg.forma==='Crédito'&&pg.parcelas?(pg.parcelas==='À vista'?' à vista':' em '+pg.parcelas):''):'Não');
    if(pg.feito==='Não')line('Combinado',pg.obs);
  }
  if(r.obs){section('Observações do técnico');texto(r.obs);}
  if(!varios)fotosPdf(aps[0],'');
  section('Declaração do cliente');
  texto(a.termo||TERMO);
  /* Assinatura do cliente e identificação do técnico */
  if(y+58>272)y=pdfNovaPagina(doc);
  y+=4;
  doc.setDrawColor(215,222,226);doc.setLineWidth(0.3);doc.roundedRect(ML,y,MR-ML,40,2,2,'S');
  doc.setFontSize(7.5);doc.setTextColor(110,110,110);doc.text('Sorocaba/SP, '+dataExtenso(new Date(a.em||Date.now())),ML+6,y+6);
  var cx1=ML+(MR-ML)/4,cx2=ML+3*(MR-ML)/4,base=y+28;
  if(a.img){try{var ar=(a.w||600)/Math.max(1,a.h||200),sw=Math.min(70,18*ar),sh=sw/ar;doc.addImage(a.img,'PNG',cx1-sw/2,base-0.5-sh,sw,sh);}catch(e){}}
  doc.setDrawColor(70,70,70);doc.setLineWidth(0.35);doc.line(cx1-36,base,cx1+36,base);doc.line(cx2-36,base,cx2+36,base);
  doc.setFont('helvetica','bold');doc.setFontSize(8.5);doc.setTextColor(az[0],az[1],az[2]);
  var rec=r.recebedor||{};
  doc.text(rec.nome||c.nome||'Cliente',cx1,base+5,{align:'center'});doc.text(tecPdf,cx2,base+5,{align:'center'});
  doc.setFont('helvetica','normal');doc.setFontSize(6.5);doc.setTextColor(140,140,140);
  doc.text('Recebedor',cx1,base+9,{align:'center'});
  doc.text('Técnico · '+PURIFIC.nome,cx2,base+9,{align:'center'});
  y+=44;
  /* Registro da assinatura: o comprovante de quando e onde foi assinada. */
  var reg=['Assinado na tela do aparelho do técnico em '+fmtDH(a.em)+'.'];
  if(r.local&&r.local.lat)reg.push('Localização: '+r.local.lat.toFixed(6)+', '+r.local.lng.toFixed(6)+' (precisão ~'+r.local.precisao+' m) — https://maps.google.com/?q='+r.local.lat.toFixed(6)+','+r.local.lng.toFixed(6));
  else reg.push('Localização: não disponível no momento da assinatura.');
  doc.setFontSize(6.8);doc.setTextColor(120,120,120);
  reg.forEach(function(t){var ls=doc.splitTextToSize(t,MR-ML);chk(ls.length*3.5);doc.text(ls,ML,y);y+=ls.length*3.5;});
  doc.setTextColor(30,30,30);
  pdfRodape(doc,new Date().toLocaleDateString('pt-BR'));
  return doc;
}
function nomePdf(){return'Pedido-'+(S.ped.numero||S.ped.id)+'-assinado.pdf';}
async function verPdf(){
  try{var doc=await montarPdf();window.open(URL.createObjectURL(doc.output('blob')),'_blank');}
  catch(e){alert('Erro ao gerar o PDF: '+e.message);}
}
async function baixarPdf(){
  try{
    var doc=await montarPdf(),a=document.createElement('a');a.href=URL.createObjectURL(doc.output('blob'));a.download=nomePdf();
    document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href);},5000);
    return true;
  }catch(e){alert('Erro ao gerar o PDF: '+e.message);return false;}
}
function blobParaDataUrl(b){return new Promise(function(ok,fail){var fr=new FileReader();fr.onload=function(){ok(fr.result);};fr.onerror=function(){fail(new Error('Falha ao ler o PDF'));};fr.readAsDataURL(b);});}
/* Envia pelo número oficial (servidor whatsapp-crm): PDF + modelo aprovado
   com o botão "Falar com um Consultor". Feito pelo comercial, depois de conferir. */
async function enviarWhatsPurific(){
  if(S.enviando)return;
  var fone=val('fone'),id=String(S.ped.id);
  if(!confirm('Enviar o relatório do pedido '+(S.ped.numero||'')+' para o WhatsApp '+fmtFone(fone)+' pelo número da Purific?'))return;
  S.enviando=true;renderPedido();
  try{
    var doc=await montarPdf(),pdf=await blobParaDataUrl(doc.output('blob'));
    var resp=await api('/api/bling/campo/enviar',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({pedidoId:S.ped.id,telefone:fone,pdf:pdf,tecnico:S.tecnico})});
    await salvarCampos({envio:{ok:true,em:Date.now(),telefone:resp.telefone,via:resp.via,por:S.tecnico}}).catch(function(){});
    toast('Relatório enviado ao cliente ✔');
  }catch(e){
    alert('Não foi possível enviar pelo WhatsApp Purific:\n\n'+e.message+'\n\nVocê pode baixar o PDF e enviar manualmente.');
  }
  S.enviando=false;
  if(S.tela==='ped'&&String(S.ped.id)===id)renderPedido();
}

/* ═══ Localização do técnico ════════════════════════════════════════════
   Sem app instalado o navegador só entrega o GPS com o app aberto na tela:
   grava a posição ao abrir o app, a cada 10 minutos enquanto ele estiver
   aberto e na assinatura de cada pedido. A tela /campo/mapa/ desenha o
   caminho do dia. */
var LOC_INTERVALO=10*60*1000,_ultLoc=0,_locTimer=null;
function registrarLocal(origem,extra){
  if(!ehTec()&&origem!=='assinatura')return;
  if(!db||!S.tecnico||!navigator.geolocation)return;
  if(origem!=='assinatura'&&Date.now()-_ultLoc<2*60*1000)return;
  _ultLoc=Date.now();
  navigator.geolocation.getCurrentPosition(function(p){gravarLocal(p.coords,p.timestamp,origem,extra);},
    function(){},{enableHighAccuracy:true,timeout:30000,maximumAge:60000});
}
function gravarLocal(c,em,origem,extra){
  var d=new Date(em||Date.now());
  var doc={tecnico:S.tecnico,lat:c.latitude!=null?c.latitude:c.lat,lng:c.longitude!=null?c.longitude:c.lng,
    precisao:Math.round(c.accuracy!=null?c.accuracy:(c.precisao||0)),em:d.getTime(),
    dia:d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),origem:origem};
  if(extra)for(var k in extra)doc[k]=extra[k];
  db.collection(C_LOC).add(doc).catch(function(){});
}
function pararLocal(){if(_locTimer){clearInterval(_locTimer);_locTimer=null;}}
function iniciarLocal(){
  if(!ehTec())return;
  registrarLocal('abertura');
  if(_locTimer)clearInterval(_locTimer);
  _locTimer=setInterval(function(){if(document.visibilityState==='visible')registrarLocal('periodico');},LOC_INTERVALO);
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&_locTimer)registrarLocal('abertura');});
}
