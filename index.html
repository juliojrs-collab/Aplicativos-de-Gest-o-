<html lang="pt-BR">
<head>

<title>Oficina Purific</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

<style>
:root{
  --bg:#f0f4f8;--surface:#fff;--surface2:#f7fafc;
  --blue:#1a56db;--blue-light:#ebf3ff;--blue-dark:#1241a8;
  --green:#0e9f6e;--green-light:#e6f6f0;
  --red:#e02424;--red-light:#fde8e8;
  --amber:#c27803;--amber-light:#fdf6b2;
  --purple:#7c3aed;--purple-light:#f0ebff;
  --teal:#0694a2;--teal-light:#e6f6f7;
  --text:#111827;--text2:#4b5563;--text3:#9ca3af;
  --border:#e5e7eb;--border2:#d1d5db;
  --r:12px;--r2:8px;
  --sh:0 1px 3px rgba(0,0,0,.08);--sh2:0 4px 16px rgba(0,0,0,.12);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.45;}
button{font:inherit;cursor:pointer;}
input,select,textarea{font:inherit;color:inherit;}
.top{position:sticky;top:0;z-index:20;background:var(--blue);color:#fff;box-shadow:var(--sh2);}
.top-in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;}
.top h1{font-size:16px;font-weight:700;flex:1;}
.top .net{font-size:11px;opacity:.85;}
.tabs{max-width:1100px;margin:0 auto;display:flex;gap:2px;padding:0 8px;overflow-x:auto;}
.tab{background:none;border:none;color:rgba(255,255,255,.75);padding:10px 14px;border-bottom:3px solid transparent;white-space:nowrap;font-weight:600;}
.tab.on{color:#fff;border-bottom-color:#fff;}
main{max-width:1100px;margin:0 auto;padding:16px 16px 96px;}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.ph h2{font-size:19px;}
.sub{color:var(--text2);font-size:12px;}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px;margin-bottom:12px;}
.card h3{font-size:14px;margin-bottom:10px;}
.btn{border:none;border-radius:var(--r2);padding:10px 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;}
.btn-p{background:var(--blue);color:#fff;}
.btn-g{background:var(--surface2);color:var(--text);border:1px solid var(--border2);}
.btn-ok{background:var(--green);color:#fff;}
.btn-no{background:var(--red);color:#fff;}
.btn-sm{padding:6px 10px;font-size:12px;}
.btn-lg{padding:14px 18px;font-size:15px;width:100%;}
.btn:disabled{opacity:.55;cursor:not-allowed;}
.fab{position:fixed;right:18px;bottom:22px;z-index:15;border-radius:28px;padding:14px 20px;box-shadow:var(--sh2);}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:4px;}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--border2);border-radius:var(--r2);padding:10px 12px;background:#fff;font-size:15px;}
.field textarea{resize:vertical;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,86,219,.12);}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 12px;}
@media(max-width:600px){.g2,.g3{grid-template-columns:1fr;}}
.req{color:var(--red);}
.hint{font-size:12px;color:var(--text3);margin-top:4px;}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;}
.chip{border:1px solid var(--border2);background:#fff;border-radius:20px;padding:6px 12px;font-size:12px;white-space:nowrap;font-weight:600;color:var(--text2);}
.chip.on{border-color:var(--blue);background:var(--blue-light);color:var(--blue);}
.chip b{margin-left:4px;}
.opts{display:flex;flex-wrap:wrap;gap:6px;}
.opts .chip{font-size:13px;padding:8px 12px;}
.search{width:100%;border:1px solid var(--border2);border-radius:var(--r2);padding:10px 12px;font-size:15px;margin-bottom:12px;background:#fff;}
.os{display:flex;gap:12px;align-items:center;cursor:pointer;}
.os:hover{box-shadow:var(--sh2);}
.os-num{font-weight:800;font-size:15px;min-width:64px;color:var(--blue-dark);}
.os-main{flex:1;min-width:0;}
.os-main .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.os-main .s{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.os-side{text-align:right;font-size:12px;}
.badge{display:inline-block;border-radius:20px;padding:3px 9px;font-size:11px;font-weight:700;white-space:nowrap;}
.b-blue{background:var(--blue-light);color:var(--blue);}
.b-amber{background:var(--amber-light);color:var(--amber);}
.b-purple{background:var(--purple-light);color:var(--purple);}
.b-teal{background:var(--teal-light);color:var(--teal);}
.b-green{background:var(--green-light);color:var(--green);}
.b-red{background:var(--red-light);color:var(--red);}
.it-row{display:grid;grid-template-columns:1fr 64px 96px 32px;gap:8px;align-items:end;padding:8px 0;border-bottom:1px solid var(--border);}
.it-row label{font-size:11px;color:var(--text2);font-weight:600;}
.it-row input{width:100%;border:1px solid var(--border2);border-radius:6px;padding:8px;font-size:15px;}
.it-n{min-width:0;font-size:13px;}
.it-n b{word-break:break-word;}
.it-x{background:none;border:none;color:var(--red);font-size:18px;padding-bottom:6px;}
.it-total{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:var(--blue-light);color:var(--blue-dark);border-radius:var(--r2);padding:10px 12px;margin:12px 0;font-size:13px;}
.it-total b{font-size:16px;}
.btn-del{background:#fff;color:var(--red);border:1px solid var(--red);}
.sig-wrap{position:relative;border:2px dashed var(--border2);border-radius:var(--r2);background:#fff;height:170px;touch-action:none;}
.sig-wrap canvas{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair;}
.sig-ph{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;color:var(--text3);pointer-events:none;font-size:14px;}
.sig-img{background:#fff;border:1px solid var(--border);border-radius:var(--r2);padding:6px;max-width:360px;}
.sig-img img{width:100%;display:block;}
.b-orange{background:#fdeedd;color:#b45309;}
.b-gray{background:#eef0f3;color:var(--text2);}
.late{color:var(--red);font-weight:700;}
.empty{text-align:center;color:var(--text3);padding:40px 16px;}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;}
.ph-t{position:relative;aspect-ratio:1;border-radius:var(--r2);overflow:hidden;background:#e5e7eb;cursor:pointer;}
.ph-t img{width:100%;height:100%;object-fit:cover;display:block;}
.ph-t .x{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;width:24px;height:24px;font-size:13px;}
.ph-t .vid{display:flex;align-items:center;justify-content:center;height:100%;font-size:30px;}
.addbar{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
.addbar .btn{flex:1;}
.status-up{font-size:12px;color:var(--blue);margin-top:6px;}
.tl{position:relative;padding-left:22px;}
.tl:before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--border);}
.tl-i{position:relative;margin-bottom:12px;}
.tl-i:before{content:"";position:absolute;left:-19px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--border2);border:2px solid #fff;}
.tl-i.done:before{background:var(--green);}
.tl-i.cur:before{background:var(--amber);}
.tl-i .n{font-weight:600;}
.tl-i .d{font-size:12px;color:var(--text2);}
.tl-i .dur{font-size:11px;color:var(--blue);font-weight:600;}
.tl-i .adj{background:none;border:none;color:var(--text3);font-size:11px;text-decoration:underline;padding:0;margin-left:6px;}
.kv{display:grid;grid-template-columns:140px 1fr;gap:4px 10px;font-size:13px;}
.kv dt{color:var(--text2);}
.kv dd{white-space:pre-wrap;word-break:break-word;}
@media(max-width:600px){.kv{grid-template-columns:1fr;}.kv dt{margin-top:6px;}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px;}
.kpi{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);padding:12px 14px;}
.kpi .l{font-size:11px;color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
.kpi .v{font-size:22px;font-weight:800;margin-top:2px;}
.kpi .h{font-size:11px;color:var(--text3);}
.bars .row{display:grid;grid-template-columns:170px 1fr 70px;gap:10px;align-items:center;margin-bottom:8px;font-size:13px;}
.bars .trk{background:var(--surface2);border-radius:6px;height:14px;overflow:hidden;}
.bars .fill{height:100%;background:var(--blue);border-radius:6px;}
.bars .val{text-align:right;font-weight:700;}
@media(max-width:600px){.bars .row{grid-template-columns:110px 1fr 58px;font-size:12px;}}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--border);}
th{font-size:11px;color:var(--text2);text-transform:uppercase;}
.tw{overflow-x:auto;}
.ov{position:fixed;inset:0;background:rgba(17,24,39,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
@media(min-width:700px){.ov{align-items:center;}}
.mdl{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:18px 16px 24px;}
@media(min-width:700px){.mdl{border-radius:16px;}}
.mdl-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.mdl-h h3{font-size:17px;}
.mdl-x{background:none;border:none;font-size:22px;color:var(--text3);}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:60;display:flex;align-items:center;justify-content:center;}
.lb img,.lb video{max-width:96vw;max-height:88vh;}
.lb .mdl-x{position:absolute;top:10px;right:14px;color:#fff;font-size:30px;}
.sug{border:1px solid var(--border2);border-radius:var(--r2);margin-top:-6px;margin-bottom:12px;max-height:220px;overflow-y:auto;background:#fff;}
.sug div{padding:9px 12px;border-bottom:1px solid var(--border);cursor:pointer;}
.sug div:hover{background:var(--blue-light);}
.sug small{color:var(--text2);}
.pick{background:var(--green-light);border-radius:var(--r2);padding:10px 12px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:20px;z-index:70;font-size:13px;box-shadow:var(--sh2);max-width:90vw;text-align:center;}
.err{background:var(--red-light);color:var(--red);border-radius:var(--r2);padding:10px 12px;margin-bottom:12px;font-size:13px;}
.info{background:var(--blue-light);color:var(--blue-dark);border-radius:var(--r2);padding:10px 12px;margin-bottom:12px;font-size:13px;}
.sec{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text2);margin:16px 0 8px;}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.actions .btn{flex:1;min-width:140px;}
</style>
</head>
<body>
<div class="top">
  <div class="top-in"><h1>🔧 Oficina Purific</h1><span class="net" id="net"></span></div>
  <div class="tabs" id="tabs"></div>
</div>
<main id="app"><div class="empty">Carregando…</div></main>
<div id="modal"></div>
<script>
/* ═══ Configuração ════════════════════════════════════════════════════════
   Mesmo projeto Firebase do AquaPure, mas em coleções próprias: este app nunca
   lê os dados do AquaPure e o AquaPure nunca carrega as fotos daqui.
   - oficina_os      → a OS em si (leve: só texto e horários)
   - oficina_midias  → uma foto/vídeo por documento, carregadas só ao abrir a OS
   - oficina_tecnicos→ lista de técnicos
   O número da OS vem do Bling, pelo servidor whatsapp-crm (Railway), que já
   guarda o acesso OAuth ao Bling. */
var FB_CFG={
  apiKey:"AIzaSyCdRdPIM7fjV-5prMCHs_3eYqS5aARSu5I",
  authDomain:"aquapure-9100b.firebaseapp.com",
  projectId:"aquapure-9100b",
  storageBucket:"aquapure-9100b.firebasestorage.app",
  messagingSenderId:"132328899335",
  appId:"1:132328899335:web:d9e7b99354b51de0a37ba2"
};
var API='https://whatsapp-crm-production-66bf.up.railway.app';
var C_OS='oficina_os',C_MID='oficina_midias',C_TEC='oficina_tecnicos';

/* Perguntas do questionário de entrada — as mesmas do AquaPure. */
var QUEST=[
  {p:'Quanto tempo tem o purificador?',o:['Menos de 1 ano','2 anos','3 anos','4 anos','Mais de 5 anos','Não sabe']},
  {p:'O purificador está vazando?',o:['Não','Sim, pouco','Sim, muito','Sim, pela bica','Às vezes']},
  {p:'O purificador está gelando normalmente?',o:['Sim','Não gela','Gela pouco','Modelo sem refrigeração']},
  {p:'Quanto tempo de uso tem o refil?',o:['Menos de 6 meses','6 a 12 meses','Mais de 1 ano','Não sabe']},
  {p:'Modelo/marca do refil?',o:['Original da marca','Paralelo/compatível','Não sabe']},
  {p:'A água utilizada é da caixa ou da rua?',o:['Caixa','Rua','Poço','Não sabe']},
  {p:'Já foi realizada alguma manutenção anterior no purificador?',o:['Não','Sim, na Purific','Sim, em outra assistência','Não sabe']}
];
/* Cada pergunta vira botões de resposta + "Outro" com campo livre. A resposta
   escolhida fica no DOM (botão .on); questLer() junta tudo na hora de salvar. */
function questHtml(px,resp){
  return QUEST.map(function(q,i){
    var atual=resp&&resp[i]?resp[i].r:'',obs=resp&&resp[i]&&resp[i].obs||'';
    var ehOutro=!!atual&&q.o.indexOf(atual)<0;
    return'<div class="field"><label>'+(i+1)+'. '+esc(q.p)+' <span class="req">*</span></label><div class="opts" id="'+px+'-q'+i+'">'
      +q.o.concat(['Outro']).map(function(op,j){
        var on=(op==='Outro')?ehOutro:op===atual;
        return'<button type="button" class="chip'+(on?' on':'')+'" data-v="'+esc(op)+'" onclick="qSel(\''+px+'\','+i+',this)">'+esc(op)+'</button>';
      }).join('')+'</div>'
      +'<input id="'+px+'-q'+i+'-outro" placeholder="Escreva a resposta" style="margin-top:6px;'+(ehOutro?'':'display:none')+'" value="'+esc(ehOutro?atual:'')+'"/>'
      +'<input id="'+px+'-q'+i+'-obs" placeholder="Observação (opcional)" style="margin-top:6px;font-size:13px;" value="'+esc(obs)+'"/></div>';
  }).join('');
}
function qSel(px,i,btn){
  var box=$(px+'-q'+i);
  Array.prototype.forEach.call(box.children,function(b){b.classList.toggle('on',b===btn);});
  var out=$(px+'-q'+i+'-outro'),outro=btn.getAttribute('data-v')==='Outro';
  out.style.display=outro?'':'none';if(outro)out.focus();
}
function questLer(px){
  var resp=[],falta=[];
  QUEST.forEach(function(q,i){
    var b=$(px+'-q'+i).querySelector('.on'),r='';
    if(b)r=b.getAttribute('data-v')==='Outro'?val(px+'-q'+i+'-outro'):b.getAttribute('data-v');
    if(!r)falta.push(i+1);
    resp.push({p:q.p,r:r,obs:val(px+'-q'+i+'-obs')});
  });
  return{respostas:resp,falta:falta};
}
function questTexto(resp){return resp.map(function(x,i){return(i+1)+'- '+x.p+'\n   '+(x.r||'-')+(x.obs?' — '+x.obs:'');}).join('\n');}
var CONDICOES=['Bom','Razoável','Ruim','Engordurado','Outro'];

/* Etapas da OS, na ordem. "t" é o carimbo de horário gravado ao entrar nela. */
var ETAPAS=[
  {k:'recebido',            l:'Aguardando orçamento', c:'b-blue',   t:'recebido'},
  {k:'em_orcamento',        l:'Em orçamento',         c:'b-amber',  t:'orcIni'},
  {k:'aguardando_preco',    l:'Aguardando preço',     c:'b-orange', t:'orcFim'},
  {k:'aguardando_aprovacao',l:'Aguardando cliente',   c:'b-purple', t:'precificado'},
  {k:'aprovado',            l:'Aprovado — na fila',   c:'b-teal',   t:'resposta'},
  {k:'em_servico',          l:'Em serviço',           c:'b-amber',  t:'servIni'},
  {k:'pronto',              l:'Pronto p/ retirada',   c:'b-green',  t:'servFim'},
  {k:'devolver',            l:'Devolver sem conserto',c:'b-red',    t:'resposta'},
  {k:'entregue',            l:'Entregue',             c:'b-gray',   t:'entregue'}
];
var ET={};ETAPAS.forEach(function(e){ET[e.k]=e;});

/* Intervalos medidos em cada OS: de um carimbo até o seguinte. */
var TRECHOS=[
  {k:'esperaOrc', l:'Espera p/ orçamento', de:'recebido', ate:'orcIni'},
  {k:'orcamento', l:'Fazendo orçamento',   de:'orcIni',   ate:'orcFim'},
  {k:'preco',     l:'Precificação (comercial)', de:'orcFim', ate:'precificado'},
  {k:'cliente',   l:'Resposta do cliente', de:'precificado', ate:'resposta'},
  {k:'esperaServ',l:'Espera p/ serviço',   de:'resposta', ate:'servIni', soAprovado:true},
  {k:'execucao',  l:'Execução do serviço', de:'servIni',  ate:'servFim'},
  {k:'retirada',  l:'Aguardando retirada', de:'servFim',  ate:'entregue'},
  {k:'total',     l:'Total na loja',       de:'recebido', ate:'entregue'}
];
/* Acima disso, a OS aparece como parada na etapa atual. */
var ALERTA_H={recebido:24,em_orcamento:24,aguardando_preco:24,aguardando_aprovacao:48,aprovado:24,em_servico:48,pronto:72,devolver:72};

/* ═══ Estado ═════════════════════════════════════════════════════════════ */
var db=null,storage=null,FB_ERR='';
var S={view:'lista',os:[],tec:[],loaded:false,filtro:'abertas',busca:'',dash:{dias:30},dbErr:''};
var unsub=[];

function initFirebase(){
  if(typeof firebase==='undefined'){FB_ERR='As bibliotecas do Firebase não carregaram. Verifique a internet e recarregue a página.';return false;}
  try{if(!firebase.apps.length)firebase.initializeApp(FB_CFG);db=firebase.firestore();}
  catch(e){FB_ERR='Falha ao iniciar o Firebase: '+e.message;return false;}
  try{storage=firebase.storage();}catch(e){storage=null;}
  return true;
}
function listen(){
  unsub.push(db.collection(C_OS).orderBy('criadoEm','desc').limit(1000).onSnapshot(function(snap){
    S.os=snap.docs.map(function(d){var o=d.data();o.id=d.id;o.tempos=o.tempos||{};return o;});
    S.loaded=true;S.dbErr='';render();if(S.modo==='detalhe')refreshDetalhe();
  },function(err){S.dbErr='Erro ao ler as OS: '+err.message;S.loaded=true;render();}));
  unsub.push(db.collection(C_TEC).onSnapshot(function(snap){
    S.tec=snap.docs.map(function(d){var o=d.data();o.id=d.id;return o;}).sort(function(a,b){return(a.nome||'').localeCompare(b.nome||'');});
    if(S.view==='tecnicos')render();
  },function(){}));
}

/* ═══ Utilidades ═════════════════════════════════════════════════════════ */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function $(id){return document.getElementById(id);}
function val(id){var e=$(id);return e?String(e.value||'').trim():'';}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function toast(m){var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove();},3000);}
function pad(n){return n<10?'0'+n:''+n;}
function fmtDH(ms){if(!ms)return'-';var d=new Date(ms);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes());}
function toLocalInput(ms){var d=new Date(ms||Date.now());return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());}
function fmtDur(ms){
  if(ms==null||isNaN(ms))return'-';
  if(ms<0)ms=0;
  var m=Math.round(ms/60000);
  if(m<60)return m+' min';
  var h=Math.floor(m/60),mm=m%60;
  if(h<24)return h+'h'+(mm?' '+pad(mm):'');
  var d=Math.floor(h/24),hh=h%24;
  return d+'d'+(hh?' '+hh+'h':'');
}
function money(v){return'R$ '+(Number(v)||0).toFixed(2).replace('.',',');}
function num(v){var n=parseFloat(String(v||'').replace(',','.'));return isNaN(n)?0:n;}

function atrasada(o){var lim=ALERTA_H[o.etapa];var d=desdeEtapa(o);return lim&&d!=null&&d>lim*3600000;}
function duracoes(o){

    if(x.soAprovado&&o.aprovado===false)return;

/* ═══ Fotos e vídeos ═════════════════════════════════════════════════════
   Fotos são reduzidas no aparelho (1280px, JPEG) antes de subir. Tentamos o
   Firebase Storage; se ele não responder em 20s (no AquaPure ele travava),
   a foto vai em base64 para o Firestore, num documento só dela. */
function compressImg(file){
  return new Promise(function(ok,fail){
    var r=new FileReader();
    r.onerror=function(){fail(new Error('Não foi possível ler a imagem'));};
    r.onload=function(ev){
      var img=new Image();
      img.onerror=function(){fail(new Error('Formato de imagem não suportado'));};
      img.onload=function(){
        var M=1280,w=img.width,h=img.height;
        if(w>M||h>M){if(w>h){h=Math.round(h*M/w);w=M;}else{w=Math.round(w*M/h);h=M;}}
        var c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        ok(c.toDataURL('image/jpeg',0.7));
      };
      img.src=ev.target.result;
    };
    r.readAsDataURL(file);
  });
}
function dataUrlToBlob(du){
  var p=du.split(','),bin=atob(p[1]),n=bin.length,u=new Uint8Array(n);
  for(var i=0;i<n;i++)u[i]=bin.charCodeAt(i);
  return new Blob([u],{type:'image/jpeg'});
}
function storagePut(path,blob,onProg,limiteMs){
  return new Promise(function(ok,fail){
    if(!storage)return fail(new Error('Storage indisponível'));
    var task,last=Date.now(),done=false;
    try{task=storage.ref(path).put(blob);}catch(e){return fail(e);}
    var wd=setInterval(function(){
      if(Date.now()-last>limiteMs){clearInterval(wd);done=true;try{task.cancel();}catch(e){}fail(new Error('O envio parou de responder'));}
    },2000);
    task.on('state_changed',function(s){last=Date.now();if(onProg&&s.totalBytes)onProg(Math.round(s.bytesTransferred/s.totalBytes*100));},
      function(err){clearInterval(wd);if(!done)fail(err);},
      function(){clearInterval(wd);task.snapshot.ref.getDownloadURL().then(ok,fail);});
  });
}
/* Depois da primeira falha do Storage, as fotos seguintes vão direto para o
   Firestore — senão cada uma esperaria os 20s de novo. */
var STORAGE_OK=null;
/* Salva as mídias de um formulário. Retorna quantas foram gravadas por grupo. */
async function salvarMidias(osId,grupo,fotos,videos){
  var n=0;
  for(var i=0;i<fotos.length;i++){
    var doc={osId:osId,grupo:grupo,tipo:'foto',criadoEm:Date.now()};
    if(STORAGE_OK!==false){
      try{doc.url=await storagePut('oficina/'+osId+'/'+grupo+'_'+uid()+'.jpg',dataUrlToBlob(fotos[i]),null,20000);STORAGE_OK=true;}
      catch(e){STORAGE_OK=false;}
    }
    if(!doc.url)doc.data=fotos[i];
    await db.collection(C_MID).add(doc);n++;
  }
  for(var j=0;j<videos.length;j++){
    await db.collection(C_MID).add({osId:osId,grupo:grupo,tipo:'video',url:videos[j].url,nome:videos[j].nome||'',criadoEm:Date.now()});n++;
  }
  return n;
}

function pickFile(accept,camera,cb){
  var inp=document.createElement('input');inp.type='file';inp.accept=accept;
  if(camera)inp.capture='environment';

   Quadro de desenho com o dedo (ou caneta/mouse). Sai como PNG pequeno,
   guardado na própria OS e impresso no relatório de entrada. */
/* Valor da avaliação técnica: entra no termo que o cliente assina, no aviso
   da recepção e no relatório de entrada. */
var VALOR_AVALIACAO=80;
var TERMO_ENTRADA='Declaro que entreguei o aparelho descrito acima nas condições registradas (fotos e respostas) e autorizo a Purific a avaliá-lo. Estou ciente de que a avaliação técnica custa '+money(VALOR_AVALIACAO)+', pagos na entrega do aparelho, e que esse valor será descontado do serviço caso eu aprove o orçamento. O orçamento será enviado para minha aprovação antes de qualquer serviço.';
/* Regra da avaliação: paga na entrada e abatida do serviço se o orçamento for
   aprovado. Se não aprovar, a avaliação fica como o valor cobrado. */
function avalPaga(o){return!!(o.avaliacao&&o.avaliacao.pago);}
function avalValor(o){return o.avaliacao&&o.avaliacao.valor!=null?o.avaliacao.valor:VALOR_AVALIACAO;}
function aReceber(o){
  var q=o.orcamento||{},t=Number(q.total)||0,av=avalValor(o);
  if(o.aprovado===false)return avalPaga(o)?0:av;
  return Math.max(0,t-(avalPaga(o)?av:0));
}
/* Texto com a conta do que cobrar, para os avisos do balcão. */
function contaCliente(o){
  var q=o.orcamento||{},av=avalValor(o);
  if(o.aprovado===false)return avalPaga(o)?'Avaliação de '+money(av)+' já paga na entrada — nada a cobrar.':'Cobrar a avaliação: <b>'+money(av)+'</b>.';
  return avalPaga(o)?'Orçamento '+money(q.total)+' − avaliação paga '+money(av)+' = <b>'+money(aReceber(o))+' a pagar</b>'
    :'Orçamento <b>'+money(q.total)+'</b> (avaliação ainda não foi paga).';
}

  passoSimples('Pagamento da avaliação','<div class="info">Confirme que o cliente pagou a avaliação de <b>'+money(VALOR_AVALIACAO)+'</b>.</div>','Confirmar pagamento',async function(){
    await avancar(id,{avaliacao:{valor:VALOR_AVALIACAO,pago:true,em:Date.now()}},'Avaliação registrada como paga');
  });
}

  return'<div class="info" style="font-size:12px;">'+esc(TERMO_ENTRADA)+'</div>'
    +'<div class="sig-wrap"><canvas id="sig-cv"></canvas><span class="sig-ph" id="sig-ph">Cliente assina aqui com o dedo</span></div>'
    +'<div style="display:flex;justify-content:space-between;align-items:center;margin:6px 0 12px;"><span class="hint" style="margin:0">A assinatura fica salva na OS e no relatório.</span>'
    +'<button type="button" class="btn btn-g btn-sm" onclick="limparAssin()">Limpar</button></div>';
}
function initAssin(){
  var cv=$('sig-cv');if(!cv)return;
  var r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);
  var ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
  ctx.lineWidth=2.4;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#111827';
  SIG={cv:cv,ctx:ctx,vazio:true,des:false};
  function pt(e){var b=cv.getBoundingClientRect();return{x:e.clientX-b.left,y:e.clientY-b.top};}
  cv.onpointerdown=function(e){e.preventDefault();cv.setPointerCapture(e.pointerId);SIG.des=true;var p=pt(e);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+0.1,p.y+0.1);ctx.stroke();
    if(SIG.vazio){SIG.vazio=false;var ph=$('sig-ph');if(ph)ph.style.display='none';}};
  cv.onpointermove=function(e){if(!SIG.des)return;e.preventDefault();var p=pt(e);ctx.lineTo(p.x,p.y);ctx.stroke();};
  cv.onpointerup=cv.onpointercancel=function(){SIG.des=false;};
}
function limparAssin(){
  if(!SIG)return;
  SIG.ctx.clearRect(0,0,SIG.cv.width,SIG.cv.height);SIG.vazio=true;
  var ph=$('sig-ph');if(ph)ph.style.display='';
}
/* PNG reduzido a 600px de largura: legível no PDF e leve no Firestore. */
function lerAssin(){
  if(!SIG||SIG.vazio)return null;
  var W=600,H=Math.round(SIG.cv.height*W/SIG.cv.width),c=document.createElement('canvas');
  c.width=W;c.height=H;c.getContext('2d').drawImage(SIG.cv,0,0,W,H);
  return{img:c.toDataURL('image/png'),w:W,h:H,em:Date.now(),termo:TERMO_ENTRADA};
}

      +'<div class="field"><label>Telefone para contato</label><input id="nv-tel" value="'+esc(NV.contato.telefone||'')+'"/></div>';

  }
  el.innerHTML='<div class="field"><label>Buscar cliente no Bling</label><input id="nv-busca" placeholder="Nome, CPF ou celular" oninput="buscarCliente(this.value)" autocomplete="off"/></div>'
    +'<div id="nv-sug"></div>'
    +'<div class="hint" style="margin:-6px 0 10px;">Não achou? Preencha abaixo que o cliente é cadastrado no Bling junto com a OS.</div>'
    +'<div class="field"><label>Nome do cliente <span class="req">*</span></label><input id="nv-nome"/></div>'
    +'<div class="g2"><div class="field"><label>Celular <span class="req">*</span></label><input id="nv-tel" inputmode="tel" placeholder="(00) 00000-0000"/></div>'
    +'<div class="field"><label>CPF/CNPJ</label><input id="nv-doc" inputmode="numeric"/></div></div>';
}
var _bt=null,_bq=0;
function buscarCliente(q){
  clearTimeout(_bt);var box=$('nv-sug');
  q=q.trim();if(q.length<3){if(box)box.innerHTML='';return;}
  _bt=setTimeout(async function(){
    var meu=++_bq;
    if(box)box.innerHTML='<div class="hint" style="margin:-6px 0 10px;">Buscando no Bling…</div>';
    try{
      var r=await fetch(API+'/api/bling/os/contatos?q='+encodeURIComponent(q));
      var j=await r.json();if(meu!==_bq)return;
      if(!r.ok)throw new Error(j.error||('HTTP '+r.status));
      NV._sug=j;
      box.innerHTML=j.length?'<div class="sug">'+j.map(function(c,i){
        return'<div onclick="escolherCliente('+i+')"><b>'+esc(c.nome)+'</b><br><small>'+esc([c.telefone,c.documento].filter(Boolean).join(' · ')||'—')+'</small></div>';
      }).join('')+'</div>':'<div class="hint" style="margin:-6px 0 10px;">Nenhum cliente encontrado.</div>';
    }catch(e){if(meu===_bq&&box)box.innerHTML='<div class="err">Não consegui buscar no Bling: '+esc(e.message)+'</div>';}
  },450);
}
function escolherCliente(i){NV.contato=NV._sug[i];renderCliente();}
function renderNumero(){
  var el=$('nv-num');if(!el)return;
  el.innerHTML=NV.manual
    ?'<div class="field"><label>Nº da OS (digitado) <span class="req">*</span></label><input id="nv-numero" placeholder="Número da OS aberta no Bling"/></div>'
      +'<button class="btn btn-g btn-sm" onclick="NV.manual=false;renderNumero()">Voltar a gerar pelo Bling</button>'
    :'<div class="info">O número será gerado automaticamente no Bling ao registrar a entrada.</div>'
      +'<button class="btn btn-g btn-sm" onclick="NV.manual=true;renderNumero()">Digitar número manualmente</button>';
}
function nvErro(m){var e=$('nv-err');if(e)e.innerHTML=m?'<div class="err" style="margin-top:12px;">'+m+'</div>':'';}
async function salvarNovaOS(){
  var btn=$('nv-ok');nvErro('');
  var cli=NV.contato?{nome:NV.contato.nome,blingId:NV.contato.id,documento:NV.contato.documento||'',telefone:val('nv-tel')}
                    :{nome:val('nv-nome'),documento:val('nv-doc'),telefone:val('nv-tel'),blingId:null};
  var os={
    cliente:cli,marca:val('nv-marca'),modelo:val('nv-modelo'),nSerie:val('nv-serie'),condicao:val('nv-cond'),
    acessorios:val('nv-acess'),problema:val('nv-prob'),atendente:val('nv-atend')
  };
  var falta=[];
  if(!cli.nome)falta.push('nome do cliente');
  if(!NV.contato&&!cli.telefone)falta.push('celular');
  if(!os.marca)falta.push('marca');
  if(!os.modelo)falta.push('modelo');
  if(!os.problema)falta.push('problema relatado');
  var qz=questLer('nv');os.respostas=qz.respostas;os.questionario=questTexto(qz.respostas);
  if(qz.falta.length)falta.push('questionário (pergunta'+(qz.falta.length>1?'s ':' ')+qz.falta.join(', ')+')');
  if(!F.fotos.length)falta.push('pelo menos 1 foto de entrada');
  if(NV.manual&&!val('nv-numero'))falta.push('nº da OS');
  if(falta.length){nvErro('Falta preencher: '+falta.join(', ')+'.');return;}
  var assin=lerAssin();
  if(!assin&&!confirm('O cliente não assinou. Registrar a entrada sem assinatura?\n(Dá para colher a assinatura depois, na OS.)'))return;
  if(assin)os.assinatura=assin;
  var pagou=$('nv-aval')&&$('nv-aval').checked;
  if(!pagou&&!confirm('A avaliação de '+money(VALOR_AVALIACAO)+' não foi marcada como paga. Registrar assim mesmo?\n(Dá para registrar o pagamento depois, na OS.)'))return;
  os.avaliacao={valor:VALOR_AVALIACAO,pago:!!pagou,em:pagou?Date.now():null};
  btn.disabled=true;
  try{
    if(NV.manual){os.numero=val('nv-numero');os.blingId=null;}
    else{
      btn.textContent='Abrindo OS no Bling…';
      var r=await fetch(API+'/api/bling/os',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
        chave:NV.chave,
        contato:cli.blingId?{id:cli.blingId}:{nome:cli.nome,telefone:cli.telefone,documento:cli.documento},
        equipamento:aparelho(os),numeroSerie:os.nSerie,descricaoProblema:os.problema,
        observacoes:[os.questionario,os.acessorios?'Acessórios: '+os.acessorios:'',os.condicao?'Condição: '+os.condicao:''].filter(Boolean).join('\n\n')
      })});
      var j=await r.json().catch(function(){return{};});
      if(!r.ok||!j.id)throw{bling:true,message:j.error||('HTTP '+r.status)};
      os.numero=j.numero||'';os.blingId=j.id;
      cli.blingId=j.contatoId||cli.blingId;
    }
    btn.textContent='Salvando fotos…';
    var agora=Date.now();
    os.etapa='recebido';os.tempos={recebido:agora};os.criadoEm=agora;os.atualizadoEm=agora;
    os.midias={entrada:F.fotos.length};
    var ref=db.collection(C_OS).doc();
    await ref.set(os);
    await salvarMidias(ref.id,'entrada',F.fotos,[]);
    if(os.atendente)gravarLocal('atendente',os.atendente);
    F.fotos=[];fecharModal();
    toast('Entrada registrada — '+osLabel(os));
    abrirOS(ref.id);
  }catch(e){
    btn.disabled=false;btn.textContent='Registrar entrada';
    if(e&&e.bling)nvErro('O Bling não abriu a OS: '+esc(e.message)+'<br>Tente de novo, ou toque em "Digitar número manualmente" e abra a OS direto no Bling.');
    else nvErro('Erro ao salvar: '+esc(e&&e.message||e));
  }
}

/* ═══ Avanço das etapas ══════════════════════════════════════════════════

   na hora, dá para corrigir em "ajustar" na linha do tempo. */
async function avancar(id,upd,msg){
  upd.atualizadoEm=Date.now();

  catch(e){alert('Erro ao salvar: '+e.message);throw e;}
}
function tecnicoSelect(idc,atual){

  var ult=atual||lerLocal('tecnico');
  return'<div class="field"><label>Técnico <span class="req">*</span></label>'
    +(nomes.length?'<select id="'+idc+'"><option value="">Selecione…</option>'+nomes.map(function(n){return'<option'+(n===ult?' selected':'')+'>'+esc(n)+'</option>';}).join('')+'</select>'
      :'<input id="'+idc+'" value="'+esc(ult)+'" placeholder="Nome do técnico"/><div class="hint">Cadastre os técnicos na aba Técnicos para escolher da lista.</div>')
    +'</div>';

/* Parte do comercial: o preço vem depois do orçamento técnico. O comercial
   busca peças (tipo P) e mão de obra/serviços (tipo S) no cadastro do Bling,
   ajusta quantidade e valor, e o app lança os itens na OS do Bling. */
/* Lista única: peça e serviço são buscados e lançados juntos. Cada item
   guarda o tipo do cadastro (P peça, S serviço) porque a OS do Bling separa
   os dois na gravação. */
var IT=[];
function precoFormHtml(o){
  var q=o.orcamento||{};
  IT=(q.itens||[]).map(function(x){return{tipo:x.tipo==='S'?'S':'P',id:x.id,nome:x.nome,codigo:x.codigo,qtd:x.qtd,valor:x.valor};});
  return'<div class="field"><label>Responsável comercial <span class="req">*</span></label><input id="ps-com" value="'+esc(o.comercial||lerLocal('comercial'))+'"/></div>'
    +(o.blingId?'':'<div class="info">Esta OS não está ligada ao Bling (o número foi digitado à mão). Os itens ficam só no app.</div>')
    +'<div class="sec">Peças e serviços</div>'
    +'<div id="it-lista"></div>'
    +'<input class="search" style="margin:6px 0 0" id="it-busca" placeholder="Buscar peça ou serviço no Bling (nome ou código)" oninput="buscarItem(this.value)" autocomplete="off"/>'
    +'<div id="it-sug" style="margin-top:6px"></div>'
    +'<div class="it-total" id="it-total"></div>';
}
function renderItens(){
  var el=$('it-lista');if(!el)return;
  el.innerHTML=IT.length?IT.map(function(x,i){
    return'<div class="it-row"><div class="it-n"><b>'+esc(x.nome)+'</b>'+(x.codigo?' <small>'+esc(x.codigo)+'</small>':'')+(x.tipo==='S'?' <span class="badge b-teal">serviço</span>':'')
      +'<div class="sub" id="it-sub-'+i+'">'+money(x.qtd*x.valor)+'</div></div>'
      +'<label>Qtd<input inputmode="decimal" value="'+x.qtd+'" oninput="itAlt('+i+',\'qtd\',this.value)"/></label>'
      +'<label>Valor un.<input inputmode="decimal" value="'+String(x.valor).replace('.',',')+'" oninput="itAlt('+i+',\'valor\',this.value)"/></label>'
      +'<button type="button" class="it-x" onclick="IT.splice('+i+',1);renderItens()">✕</button></div>';
  }).join(''):'<div class="sub">Nenhum item.</div>';
  itTotal();
}
function itSoma(t){return IT.reduce(function(a,x){return a+(!t||x.tipo===t?x.qtd*x.valor:0);},0);}
function itTotal(){var el=$('it-total');if(el)el.innerHTML='<span>'+IT.length+' ite'+(IT.length===1?'m':'ns')+'</span><b>Total '+money(itSoma())+'</b>';}
function itAlt(i,k,v){
  IT[i][k]=num(v);
  var sb=$('it-sub-'+i);if(sb)sb.textContent=money(IT[i].qtd*IT[i].valor);
  itTotal();
}
var _it={n:0,r:[]};
function buscarItem(q){
  clearTimeout(_it.t);var box=$('it-sug');q=q.trim();
  if(q.length<2){if(box)box.innerHTML='';return;}
  _it.t=setTimeout(async function(){
    var meu=++_it.n;
    box.innerHTML='<div class="hint">Buscando no Bling…</div>';
    try{
      var r=await fetch(API+'/api/bling/os/produtos?tipo=T&q='+encodeURIComponent(q));
      var j=await r.json();if(meu!==_it.n)return;
      if(!r.ok)throw new Error(j.error||('HTTP '+r.status));
      _it.r=j;
      box.innerHTML=j.length?'<div class="sug" style="margin:0">'+j.map(function(p,i){
        return'<div onclick="addItem('+i+')"><b>'+esc(p.nome)+'</b>'+(p.tipo==='S'?' <span class="badge b-teal">serviço</span>':'')+'<br><small>'+esc(p.codigo||'sem código')+' · '+money(p.preco)+'</small></div>';
      }).join('')+'</div>':'<div class="hint">Nada encontrado no Bling.</div>';
    }catch(e){if(meu===_it.n)box.innerHTML='<div class="err">Não consegui buscar no Bling: '+esc(e.message)+'</div>';}
  },450);
}
function addItem(i){
  var p=_it.r[i];if(!p)return;
  IT.push({tipo:p.tipo==='S'?'S':'P',id:p.id,nome:p.nome,codigo:p.codigo,qtd:1,valor:p.preco||0});
  $('it-busca').value='';$('it-sug').innerHTML='';renderItens();
}
function corpoBling(lista){
  return JSON.stringify({pecas:lista.filter(function(x){return x.tipo!=='S';}),servicos:lista.filter(function(x){return x.tipo==='S';})});
}
/* Lê os itens do formulário, lança no Bling (se a OS veio de lá) e devolve os
   campos do orçamento a gravar. Devolve false quando o usuário desiste. */
async function salvarItens(o){
  var com=val('ps-com');
  if(!com){psErro('Informe o responsável comercial.');return false;}
  var itens=IT.map(function(x){return{tipo:x.tipo,id:x.id,nome:x.nome,codigo:x.codigo||'',qtd:x.qtd,valor:Math.round(x.valor*100)/100};});
  if(!itens.length){psErro('Adicione pelo menos uma peça ou serviço.');return false;}
  if(itens.some(function(x){return!(x.qtd>0);})){psErro('Quantidade precisa ser maior que zero.');return false;}
  var pc=itSoma('P'),mo=itSoma('S'),r={comercial:com,itens:itens,valorPecas:pc,maoObra:mo,total:pc+mo,blingLancadoEm:null,blingErro:''};
  gravarLocal('comercial',com);
  if(o.blingId){
    $('ps-ok').textContent='Lançando no Bling…';
    try{
      var resp=await fetch(API+'/api/bling/os/'+o.blingId+'/itens',{method:'PUT',headers:{'Content-Type':'application/json'},body:corpoBling(itens)});
      var j=await resp.json().catch(function(){return{};});
      if(!resp.ok)throw new Error(j.error||('HTTP '+resp.status));
      r.blingLancadoEm=Date.now();
    }catch(e){
      r.blingErro=e.message;
      if(!confirm('Não foi possível lançar os itens no Bling:\n'+e.message+'\n\nSalvar só no app? Depois dá para tentar de novo pelo botão "Lançar no Bling".')){
        $('ps-ok').textContent='Tentar de novo';return false;
      }
    }
  }
  return r;
}
async function relancarBling(id){
  var o=getOS(id),q=o&&o.orcamento;if(!q||!q.itens)return;
  toast('Lançando no Bling…');
  try{
    var resp=await fetch(API+'/api/bling/os/'+o.blingId+'/itens',{method:'PUT',headers:{'Content-Type':'application/json'},body:corpoBling(q.itens)});
    var j=await resp.json().catch(function(){return{};});
    if(!resp.ok)throw new Error(j.error||('HTTP '+resp.status));
    await avancar(id,{'orcamento.blingLancadoEm':Date.now(),'orcamento.blingErro':''},'Itens lançados no Bling');
  }catch(e){alert('Não foi possível lançar no Bling: '+e.message);}
}
function temPreco(o){var q=o.orcamento||{};return!!(o.tempos.precificado||q.precificadoEm||(q.itens&&q.itens.length));}
function resumoTecnico(o){
  var q=o.orcamento||{};
  return'<div class="card" style="background:var(--surface2);box-shadow:none;"><dl class="kv">'
    +'<dt>Técnico</dt><dd>'+esc(o.tecnicoOrc||'-')+'</dd>'
    +'<dt>Diagnóstico</dt><dd>'+esc(q.diagnostico||'-')+'</dd>'
    +(q.servicos?'<dt>Serviços</dt><dd>'+esc(q.servicos)+'</dd>':'')
    +'<dt>Peças</dt><dd>'+esc(q.pecas||'Nenhuma')+'</dd></dl></div>';
}
function precificar(id){
  var o=getOS(id);
  passoSimples('Colocar preço',resumoTecnico(o)+precoFormHtml(o),'Salvar e passar ao cliente',async function(){
    var r=await salvarItens(o);if(!r)return false;
    /* Na etapa "Aguardando preço" o preço avança a OS e conta na medição. OS
       que já passaram dessa fase sem preço (abertas antes desta etapa existir)
       só recebem o preço: a etapa e os horários ficam como estão. */
    var noFluxo=o.etapa==='aguardando_preco';
    var upd=noFluxo?{etapa:'aguardando_aprovacao','tempos.precificado':Date.now(),comercial:r.comercial}:{comercial:r.comercial,'orcamento.precificadoEm':Date.now()};
    ['itens','valorPecas','maoObra','total','blingLancadoEm','blingErro'].forEach(function(k){upd['orcamento.'+k]=r[k];});
    await avancar(id,upd,(r.blingLancadoEm?'Itens lançados no Bling':'Preço salvo')+(noFluxo?' — passe ao cliente':''));
  });
  renderItens();
}

    +midiaFormHtml('Fotos mostrando o problema',true,true),
    'Finalizar orçamento',async function(){
      var tec=val('ps-tec'),diag=val('ps-diag');
      if(!tec){psErro('Escolha o técnico.');return false;}
      if(!diag){psErro('Escreva o diagnóstico.');return false;}

/* Corrige o orçamento sem mexer na etapa nem nos horários medidos. Cada
   alteração guarda o valor anterior, para ficar claro se o preço mudou depois
   que o cliente já tinha respondido. */
/* Parte do técnico: diagnóstico, serviços e peças necessárias (+ fotos).
   Não mexe em preço nem no Bling. */
function editarDiag(id){
  var o=getOS(id);
  resetMidiaForm('problema',6,1);
  passoSimples('Editar diagnóstico',
    orcFormHtml(o)+midiaFormHtml('Adicionar fotos do problema (opcional)',true,false),
    'Salvar diagnóstico',async function(){
      var tec=val('ps-tec'),diag=val('ps-diag');
      if(!tec){psErro('Escolha o técnico.');return false;}
      if(!diag){psErro('Escreva o diagnóstico.');return false;}
      if(F.enviandoVideo){psErro('Espere o vídeo terminar de enviar.');return false;}
      var upd={tecnicoOrc:tec,'orcamento.diagnostico':diag,'orcamento.servicos':val('ps-serv'),'orcamento.pecas':val('ps-pecas'),'orcamento.diagEditadoEm':Date.now()};
      var novas=F.fotos.length+F.videos.length;
      if(novas){
        $('ps-ok').textContent='Salvando fotos…';
        try{await salvarMidias(id,'problema',F.fotos,F.videos);}
        catch(e){psErro('Erro ao salvar as fotos: '+e.message);$('ps-ok').textContent='Salvar diagnóstico';throw e;}
        var nm=(o.midias||{});nm.problema=(nm.problema||0)+novas;upd.midias=nm;
        F.fotos=[];F.videos=[];
      }
      gravarLocal('tecnico',tec);
      await avancar(id,upd,'Diagnóstico atualizado');
    });
  renderMidiaForm();
}
/* Parte do comercial: itens e preços, relançados no Bling. Cada mudança de
   valor fica no histórico, para saber se o preço mudou depois da resposta do
   cliente. */
function editarOrc(id){
  var o=getOS(id);
  var aviso=o.aprovado===true?'<div class="info">O cliente já aprovou este orçamento. Se o valor mudar, confirme com ele de novo.</div>'
    :o.aprovado===false?'<div class="info">O cliente não aprovou este orçamento.</div>':'';
  passoSimples('Editar preço',aviso+resumoTecnico(o)+precoFormHtml(o),'Salvar preço',async function(){
    var ant=o.orcamento||{},r=await salvarItens(o);if(!r)return false;
    var hist=(ant.historico||[]).slice();
    if(Math.abs((ant.total||0)-r.total)>0.001)hist.push({em:Date.now(),de:ant.total||0,para:r.total});
    var upd={comercial:r.comercial,'orcamento.historico':hist,'orcamento.editadoEm':Date.now()};
    ['itens','valorPecas','maoObra','total','blingLancadoEm','blingErro'].forEach(function(k){upd['orcamento.'+k]=r[k];});
    await avancar(id,upd,r.blingLancadoEm?'Preço atualizado e relançado no Bling':'Preço atualizado');
  });
  renderItens();
}

/* Apaga a OS do app (com fotos e vídeos) e, se marcado, também no Bling. */
function apagarOS(id){
  var o=getOS(id);if(!o)return;
  passoSimples('Apagar '+esc(osLabel(o)),
    '<div class="err">Isto apaga a OS de <b>'+esc(o.cliente&&o.cliente.nome||'-')+'</b> ('+esc(aparelho(o))+'), com todas as fotos, vídeos e horários. Não dá para desfazer.</div>'
    +(o.blingId?'<label style="display:flex;gap:8px;align-items:center;margin-bottom:12px;font-size:14px;"><input type="checkbox" id="ps-bling" checked style="width:20px;height:20px;"/> Apagar também a OS nº '+esc(o.numero||'')+' no Bling</label>'
      :'<div class="hint" style="margin-bottom:12px;">Esta OS não está ligada ao Bling; só o app é apagado.</div>'),
    'Apagar definitivamente',async function(){
      var b=$('ps-ok');
      if(o.blingId&&$('ps-bling').checked){
        b.textContent='Apagando no Bling…';
        try{
          var r=await fetch(API+'/api/bling/os/'+o.blingId,{method:'DELETE'});
          var j=await r.json().catch(function(){return{};});
          if(!r.ok)throw new Error(j.error||('HTTP '+r.status));
        }catch(e){
          if(!confirm('Não foi possível apagar no Bling:\n'+e.message+'\n\nApagar só no app?')){b.textContent='Apagar definitivamente';return false;}
        }
      }
      b.textContent='Apagando…';
      try{
        var ms=await carregarMidias(id);
        for(var i=0;i<ms.length;i++){
          if(ms[i].url&&storage){try{await storage.refFromURL(ms[i].url).delete();}catch(e){}}
          await db.collection(C_MID).doc(ms[i].id).delete();
        }
        await db.collection(C_OS).doc(id).delete();
      }catch(e){psErro('Erro ao apagar: '+e.message);b.textContent='Apagar definitivamente';throw e;}
      S.abertaId=null;fecharModal();toast(osLabel(o)+' apagada');
      return false;
    });
  $('ps-ok').className='btn btn-no';
}
var NOMES_T={recebido:'Entrada na loja',orcIni:'Início do orçamento',orcFim:'Fim do orçamento',precificado:'Preço do comercial',resposta:'Resposta do cliente',servIni:'Início do serviço',servFim:'Fim do serviço',entregue:'Entrega'};
var ORDEM_T=['recebido','orcIni','orcFim','precificado','resposta','servIni','servFim','entregue'];
function ajustarHora(id,k){
  var o=getOS(id);
  passoSimples('Ajustar horário','<div class="field"><label>'+esc(NOMES_T[k])+'</label><input type="datetime-local" id="ps-dh" value="'+toLocalInput(o.tempos[k])+'"/></div>'
    +'<div class="hint" style="margin-bottom:12px;">Use só para corrigir quando o botão não foi tocado na hora certa.</div>','Salvar',async function(){
      var v=val('ps-dh');var ms=new Date(v).getTime();
      if(!v||isNaN(ms)){psErro('Data inválida.');return false;}
      var i=ORDEM_T.indexOf(k),t=o.tempos;
      for(var a=i-1;a>=0;a--)if(t[ORDEM_T[a]]){if(ms<t[ORDEM_T[a]]){psErro('Não pode ser antes de "'+NOMES_T[ORDEM_T[a]]+'" ('+fmtDH(t[ORDEM_T[a]])+').');return false;}break;}
      for(var b=i+1;b<ORDEM_T.length;b++)if(t[ORDEM_T[b]]){if(ms>t[ORDEM_T[b]]){psErro('Não pode ser depois de "'+NOMES_T[ORDEM_T[b]]+'" ('+fmtDH(t[ORDEM_T[b]])+').');return false;}break;}
      var upd={};upd['tempos.'+k]=ms;
      if(k==='recebido')upd.criadoEm=ms;
      await avancar(id,upd,'Horário ajustado');
    });
}

    +'<div class="g2"><div class="field"><label>Marca</label><input id="ed-marca" value="'+esc(o.marca||'')+'"/></div>'
    +'<div class="field"><label>Modelo</label><input id="ed-modelo" value="'+esc(o.modelo||'')+'"/></div></div>'

    +'<div class="field"><label>Condição</label><select id="ed-cond"><option value="">-</option>'+cond+'</select></div></div>'
    +'<div class="field"><label>Acessórios</label><input id="ed-acess" value="'+esc(o.acessorios||'')+'"/></div>'
    +'<div class="field"><label>Problema relatado</label><textarea id="ed-prob" rows="3">'+esc(o.problema||'')+'</textarea></div>'
    +(o.respostas?'<div class="sec">Questionário</div>'+questHtml('ed',o.respostas)
      :'<div class="field"><label>Questionário</label><textarea id="ed-quest" rows="8" style="font-size:13px;">'+esc(o.questionario||'')+'</textarea></div>'),
    'Salvar',async function(){
      var qz=o.respostas?questLer('ed'):null;
      if(qz&&qz.falta.length){psErro('Responda a pergunta '+qz.falta.join(', ')+' do questionário.');return false;}
      var qupd=qz?{respostas:qz.respostas,questionario:questTexto(qz.respostas)}:{questionario:val('ed-quest')};
      await avancar(id,Object.assign(qupd,{numero:val('ed-num'),'cliente.nome':val('ed-nome'),'cliente.telefone':val('ed-tel'),marca:val('ed-marca'),modelo:val('ed-modelo'),
        nSerie:val('ed-serie'),condicao:val('ed-cond'),acessorios:val('ed-acess'),problema:val('ed-prob')}),'Dados atualizados');
    });
}

var MESES_EXT=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function dataExtenso(d){
  d=d||new Date();
  return d.getDate()+' de '+MESES_EXT[d.getMonth()]+' de '+d.getFullYear();
}

/* Marca d'agua: logo central, bem suave, por cima do conteudo. */
function pdfMarcaDagua(doc){
  try{
    var w=132,h=w*LOGO_RATIO;
    doc.saveGraphicsState();
    doc.setGState(new doc.GState({opacity:0.07}));
    doc.addImage(LOGO_PURIFIC,'PNG',(210-w)/2,(297-h)/2,w,h);
    doc.restoreGraphicsState();
  }catch(e){}
}

/* Nova pagina ja com marca d'agua e cabecalho reduzido. Devolve o Y inicial. */
var PDF_TOPY=27;
function pdfNovaPagina(doc){
  doc.addPage();
  try{doc.addImage(LOGO_PURIFIC,'PNG',14,9,34,34*LOGO_RATIO);}catch(e){}
  var a=PURIFIC.azul;
  doc.setDrawColor(a[0],a[1],a[2]);doc.setLineWidth(0.4);doc.line(14,21,196,21);
  doc.setTextColor(30,30,30);doc.setFont('helvetica','normal');
  return PDF_TOPY;
}

/* Cabecalho da primeira pagina. Devolve o Y livre abaixo dele. */

  var ML=14,MR=196,a=PURIFIC.azul,v=PURIFIC.verde;
  try{doc.addImage(LOGO_PURIFIC,'PNG',ML,10,48,48*LOGO_RATIO);}catch(e){}
  doc.setFont('helvetica','bold');doc.setFontSize(12.5);
  doc.setTextColor(a[0],a[1],a[2]);
  doc.text(titulo,MR,16,{align:'right'});
  doc.setFont('helvetica','normal');doc.setFontSize(7.5);
  doc.setTextColor(120,120,120);
  doc.text(subtitulo,MR,21,{align:'right'});
  doc.setTextColor(130,130,130);doc.setFontSize(7);
  doc.text(PURIFIC.nome+'  ·  CNPJ '+PURIFIC.cnpj,MR,25.5,{align:'right'});
  /* filete azul com realce verde, ecoando o logo */
  doc.setDrawColor(a[0],a[1],a[2]);doc.setLineWidth(0.6);doc.line(ML,29,MR,29);
  doc.setDrawColor(v[0],v[1],v[2]);doc.setLineWidth(0.6);doc.line(ML,29,ML+38,29);
  /* faixa de identificacao */
  doc.setFillColor(240,247,250);doc.roundedRect(ML,33,MR-ML,13,1.5,1.5,'F');
  var colW=(MR-ML)/infos.length;
  for(var i=0;i<infos.length;i++){
    var x=ML+4+i*colW;
    doc.setFont('helvetica','bold');doc.setFontSize(6);doc.setTextColor(a[0],a[1],a[2]);
    doc.text(infos[i][0].toUpperCase(),x,38);
    doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(40,40,40);
    doc.text(doc.splitTextToSize(String(infos[i][1]||'-'),colW-6)[0],x,43);
  }
  doc.setTextColor(30,30,30);
  return 50;
}

/* ═══ Relatório de entrada (PDF para o cliente) ══════════════════════════
   Identidade visual copiada do AquaPure (cabeçalho, marca d'água, rodapé).
   O jsPDF só é baixado na primeira vez que alguém gera um relatório, para o
   app abrir leve no celular. */
var JSPDF_URL='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
var _jspdfP=null;
function carregarJsPDF(){
  if(window.jspdf)return Promise.resolve();
  if(_jspdfP)return _jspdfP;
  _jspdfP=new Promise(function(ok,fail){
    var sc=document.createElement('script');sc.src=JSPDF_URL;
    sc.onload=function(){ok();};
    sc.onerror=function(){_jspdfP=null;fail(new Error('Não foi possível carregar o gerador de PDF. Verifique a internet.'));};
    document.head.appendChild(sc);
  });
  return _jspdfP;
}
/* Fotos no Storage vêm como link; o PDF precisa dos bytes. */
function fotoDataUrl(m){
  if(m.data)return Promise.resolve(m.data);
  return fetch(m.url).then(function(r){return r.blob();}).then(function(b){
    return new Promise(function(ok){var fr=new FileReader();fr.onload=function(){ok(fr.result);};fr.readAsDataURL(b);});
  }).catch(function(){return null;});
}
function tamanhoImg(du){
  return new Promise(function(ok){var im=new Image();im.onload=function(){ok({w:im.width,h:im.height});};im.onerror=function(){ok(null);};im.src=du;});
}
var _rel=null;
async function relatorioEntrada(id){
  var o=getOS(id);if(!o)return;
  toast('Gerando relatório…');
  try{
    await carregarJsPDF();
    var midias=(S.abertaId===id&&S.midias)?S.midias:await carregarMidias(id);
    var fotos=[];
    var ent=midias.filter(function(m){return m.grupo==='entrada'&&m.tipo==='foto';});
    for(var i=0;i<ent.length;i++){var du=await fotoDataUrl(ent[i]);if(du)fotos.push({du:du,sz:await tamanhoImg(du)});}
    var doc=montarPdfEntrada(o,fotos);
    var nome='Entrada-OS-'+(o.numero||o.id)+'.pdf';
    _rel={blob:doc.output('blob'),nome:nome,o:o};
  }catch(e){alert('Erro ao gerar o relatório: '+e.message);return;}
  var podeCompartilhar=false;
  try{podeCompartilhar=!!(navigator.canShare&&navigator.canShare({files:[new File([_rel.blob],_rel.nome,{type:'application/pdf'})]}));}catch(e){}
  modal('Relatório de entrada',
    '<div class="info">Relatório da '+esc(osLabel(o))+' pronto.'+(podeCompartilhar?' Toque em "Enviar" e escolha o WhatsApp do cliente.':' Baixe o PDF e envie pelo WhatsApp Web.')+'</div>'
    +'<div class="actions">'
    +(podeCompartilhar?'<button class="btn btn-ok" onclick="compartilharRel()">📤 Enviar (WhatsApp…)</button>':'')
    +'<button class="btn btn-g" onclick="baixarRel()">⬇ Baixar PDF</button>'
    +'<button class="btn btn-g" onclick="abrirRel()">👁 Ver</button></div>'
    +'<div class="actions"><button class="btn btn-g" onclick="voltarDetalhe()">Voltar à OS</button></div>');
  S.modo='passo';
}
function compartilharRel(){
  if(!_rel)return;
  var f=new File([_rel.blob],_rel.nome,{type:'application/pdf'});
  var c=_rel.o.cliente||{};
  navigator.share({files:[f],title:_rel.nome,text:'Olá'+(c.nome?' '+c.nome.split(' ')[0]:'')+'! Segue o comprovante de entrada do seu purificador na Purific ('+osLabel(_rel.o)+').'})
    .catch(function(e){if(e&&e.name!=='AbortError')alert('Não foi possível compartilhar: '+e.message);});
}
function baixarRel(){
  if(!_rel)return;
  var a=document.createElement('a');a.href=URL.createObjectURL(_rel.blob);a.download=_rel.nome;
  document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href);},5000);
}
function abrirRel(){if(_rel)window.open(URL.createObjectURL(_rel.blob),'_blank');}
function montarPdfEntrada(o,fotos){
  var doc=new window.jspdf.jsPDF();
  var ML=14,MR=196,az=PURIFIC.azul,c=o.cliente||{};
  var y=pdfCabecalho(doc,'RELATÓRIO DE ENTRADA','Recebimento de aparelho para avaliação técnica',[
    ['N° OS',o.numero||'-'],['Entrada',fmtDH(o.tempos&&o.tempos.recebido)],['Atendente',o.atendente||'-']
  ]);
  function chk(n){if(y+n>272){y=pdfNovaPagina(doc);doc.setFontSize(8.5);}}
  /* 26mm: o título nunca fica sozinho no pé da página, longe do conteúdo. */
  function section(t){
    chk(26);y+=3;
    doc.setFillColor(240,247,250);doc.rect(ML,y-4.5,MR-ML,7,'F');
    doc.setFillColor(az[0],az[1],az[2]);doc.rect(ML,y-4.5,1.6,7,'F');
    doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(az[0],az[1],az[2]);
    doc.text(t,ML+4,y);doc.setTextColor(30,30,30);doc.setFontSize(8.5);y+=7;
  }
  function line(lbl,v){
    if(!v)return;
    var ls=doc.splitTextToSize(String(v),MR-ML-45);chk(ls.length*4.5+2);
    doc.setFont('helvetica','bold');doc.text(lbl+':',ML,y);
    doc.setFont('helvetica','normal');doc.text(ls,ML+45,y);y+=ls.length*4.5+1.5;
  }
  doc.setFontSize(8.5);
  section('Cliente');
  line('Nome',c.nome);line('Telefone',c.telefone);line('CPF/CNPJ',c.documento);
  section('Aparelho');
  line('Purificador',aparelho(o));line('N° de série',o.nSerie);
  line('Condição de limpeza',o.condicao);line('Acessórios entregues',o.acessorios||'Nenhum');
  section('Problema relatado pelo cliente');
  var lp=doc.splitTextToSize(o.problema||'-',MR-ML-4);chk(lp.length*4.5+2);
  doc.setFont('helvetica','normal');doc.text(lp,ML+2,y);y+=lp.length*4.5+2;
  if(o.respostas||o.questionario){
    section('Questionário de entrada');
    if(o.respostas){
      o.respostas.forEach(function(r,i){
        var lq=doc.splitTextToSize((i+1)+'. '+r.p,MR-ML-4);
        var lr=doc.splitTextToSize((r.r||'-')+(r.obs?' — '+r.obs:''),MR-ML-10);
        chk((lq.length+lr.length)*4.5+2);
        doc.setFont('helvetica','bold');doc.text(lq,ML+2,y);y+=lq.length*4.5;
        doc.setFont('helvetica','normal');doc.text(lr,ML+8,y);y+=lr.length*4.5+1.5;
      });
    }else{
      var lt=doc.splitTextToSize(o.questionario,MR-ML-4);chk(lt.length*4.5);
      doc.setFont('helvetica','normal');doc.text(lt,ML+2,y);y+=lt.length*4.5+2;
    }
  }
  if(fotos.length){
    section('Como o aparelho chegou');
    var W=58,H=44,G=4;
    for(var i=0;i<fotos.length;i++){
      var col=i%3;if(col===0){chk(H+4);if(i>0)y+=H+G;}
      var x=ML+col*(W+G),f=fotos[i],w=W,h=H;
      if(f.sz){var r=Math.min(W/f.sz.w,H/f.sz.h);w=f.sz.w*r;h=f.sz.h*r;}
      try{doc.addImage(f.du,'JPEG',x+(W-w)/2,y+(H-h)/2,w,h);}catch(e){}
      doc.setDrawColor(210,210,210);doc.setLineWidth(0.2);doc.rect(x,y,W,H);
    }
    y+=H+4;
  }
  section('Próximos passos');
  var termo=['Seu purificador será avaliado pela nossa equipe técnica.',
    'Avaliação técnica: '+money(avalValor(o))+(avalPaga(o)?' (paga na entrada)':' (a pagar)')+'. Se o orçamento for aprovado, esse valor é descontado do serviço.',
    'Antes de qualquer serviço, entraremos em contato com o orçamento para sua aprovação.',
    'Guarde este comprovante: o número da OS identifica o seu aparelho na loja.'];
  doc.setFont('helvetica','normal');
  termo.forEach(function(t){var l=doc.splitTextToSize('• '+t,MR-ML-4);chk(l.length*4.5);doc.text(l,ML+2,y);y+=l.length*4.5+1;});
  if(o.assinatura&&o.assinatura.termo){
    section('Declaração do cliente');
    var ld=doc.splitTextToSize(o.assinatura.termo,MR-ML-4);chk(ld.length*4.5);
    doc.setFont('helvetica','normal');doc.text(ld,ML+2,y);y+=ld.length*4.5+1;
  }
  /* Assinaturas: cliente e loja */
  if(y+40>272)y=pdfNovaPagina(doc);
  y+=8;
  doc.setDrawColor(215,222,226);doc.setLineWidth(0.3);doc.roundedRect(ML,y,MR-ML,32,2,2,'S');
  doc.setFontSize(7.5);doc.setTextColor(110,110,110);doc.text('Sorocaba/SP, '+dataExtenso(new Date(o.tempos&&o.tempos.recebido||Date.now())),ML+6,y+7);
  var cx1=ML+(MR-ML)/4,cx2=ML+3*(MR-ML)/4;
  if(o.assinatura&&o.assinatura.img){
    try{var sh=15,sw=Math.min(70,sh*(o.assinatura.w||600)/Math.max(1,o.assinatura.h||200));doc.addImage(o.assinatura.img,'PNG',cx1-sw/2,y+4.5,sw,sh);}catch(e){}
  }
  doc.setDrawColor(70,70,70);doc.setLineWidth(0.35);doc.line(cx1-36,y+20,cx1+36,y+20);doc.line(cx2-36,y+20,cx2+36,y+20);
  doc.setFont('helvetica','bold');doc.setFontSize(8.5);doc.setTextColor(az[0],az[1],az[2]);
  doc.text(c.nome||'Cliente',cx1,y+25,{align:'center'});doc.text(PURIFIC.nome,cx2,y+25,{align:'center'});
  doc.setFont('helvetica','normal');doc.setFontSize(6.5);doc.setTextColor(140,140,140);
  doc.text(o.assinatura?'Cliente · assinado em '+fmtDH(o.assinatura.em):'Cliente',cx1,y+29,{align:'center'});doc.text('Atendente: '+(o.atendente||'-'),cx2,y+29,{align:'center'});
  doc.setTextColor(30,30,30);
  pdfRodape(doc,new Date().toLocaleDateString('pt-BR'));
  return doc;
}

/* ═══ Medição ════════════════════════════════════════════════════════════ */
function media(arr){if(!arr.length)return null;return arr.reduce(function(a,b){return a+b;},0)/arr.length;}
function mediana(arr){if(!arr.length)return null;var s=arr.slice().sort(function(a,b){return a-b;});var m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2;}
function vPainel(){
  var dias=S.dash.dias,desde=dias?Date.now()-dias*86400000:0;
  var per=S.os.filter(function(o){return(o.tempos.recebido||o.criadoEm||0)>=desde;});
  var abertas=S.os.filter(function(o){return o.etapa!=='entregue';});
  var paradas=abertas.filter(atrasada).sort(function(a,b){return desdeEtapa(b)-desdeEtapa(a);});
  var entregues=per.filter(function(o){return o.etapa==='entregue';});
  var respondidas=per.filter(function(o){return o.aprovado===true||o.aprovado===false;});
  var aprov=respondidas.filter(function(o){return o.aprovado===true;}).length;
  var porTrecho={};TRECHOS.forEach(function(x){porTrecho[x.k]=[];});
  per.forEach(function(o){var d=duracoes(o);for(var k in d)porTrecho[k].push(d[k]);});
  var h='<div class="ph"><div><h2>Medição</h2><p class="sub">Tempo de cada etapa, contado em horas corridas (inclui noites e fins de semana).</p></div>'
    +'<div class="chips" style="margin:0">'+[[7,'7 dias'],[30,'30 dias'],[90,'90 dias'],[0,'Tudo']].map(function(p){
      return'<button class="chip'+(dias===p[0]?' on':'')+'" onclick="S.dash.dias='+p[0]+';render()">'+p[1]+'</button>';}).join('')+'</div></div>';
  h+='<div class="kpis">'
    +'<div class="kpi"><div class="l">Recebidas</div><div class="v">'+per.length+'</div><div class="h">no período</div></div>'
    +'<div class="kpi"><div class="l">Entregues</div><div class="v">'+entregues.length+'</div><div class="h">das recebidas no período</div></div>'
    +'<div class="kpi"><div class="l">Abertas agora</div><div class="v">'+abertas.length+'</div><div class="h">'+paradas.length+' paradas</div></div>'
    +'<div class="kpi"><div class="l">Tempo total médio</div><div class="v">'+fmtDur(media(porTrecho.total))+'</div><div class="h">mediana '+fmtDur(mediana(porTrecho.total))+'</div></div>'
    +'<div class="kpi"><div class="l">Aprovação</div><div class="v">'+(respondidas.length?Math.round(aprov/respondidas.length*100)+'%':'-')+'</div><div class="h">'+aprov+' de '+respondidas.length+' orçamentos</div></div>'
    +'</div>';
  var etapasT=TRECHOS.filter(function(x){return x.k!=='total';});
  var maxM=Math.max.apply(null,etapasT.map(function(x){return media(porTrecho[x.k])||0;}).concat([1]));
  h+='<div class="card"><h3>Tempo médio por etapa</h3><div class="bars">'+etapasT.map(function(x){
    var m=media(porTrecho[x.k]);
    return'<div class="row"><div>'+esc(x.l)+' <span class="sub">('+porTrecho[x.k].length+')</span></div><div class="trk"><div class="fill" style="width:'+(m?Math.max(2,m/maxM*100):0)+'%"></div></div><div class="val">'+fmtDur(m)+'</div></div>';
  }).join('')+'</div><div class="hint">Entre parênteses: quantas OS tiveram a etapa medida. Barras maiores mostram onde o aparelho fica mais tempo parado.</div></div>';
  /* Por técnico */
  var tecs={};
  per.forEach(function(o){
    var d=duracoes(o);
    if(o.tecnicoOrc&&d.orcamento!=null){(tecs[o.tecnicoOrc]=tecs[o.tecnicoOrc]||{orc:[],exe:[]}).orc.push(d.orcamento);}
    if(o.tecnico&&d.execucao!=null){(tecs[o.tecnico]=tecs[o.tecnico]||{orc:[],exe:[]}).exe.push(d.execucao);}
  });
  var nt=Object.keys(tecs).sort();
  h+='<div class="card"><h3>Por técnico</h3>'+(nt.length?'<div class="tw"><table><thead><tr><th>Técnico</th><th>Orçamentos</th><th>Tempo médio orçamento</th><th>Serviços</th><th>Tempo médio execução</th></tr></thead><tbody>'
    +nt.map(function(n){var x=tecs[n];return'<tr><td><b>'+esc(n)+'</b></td><td>'+x.orc.length+'</td><td>'+fmtDur(media(x.orc))+'</td><td>'+x.exe.length+'</td><td>'+fmtDur(media(x.exe))+'</td></tr>';}).join('')
    +'</tbody></table></div>':'<div class="sub">Ainda sem orçamentos ou serviços finalizados no período.</div>')+'</div>';
  var coms={};
  per.forEach(function(o){var d=duracoes(o);if(o.comercial&&d.preco!=null)(coms[o.comercial]=coms[o.comercial]||[]).push(d.preco);});
  var nc=Object.keys(coms).sort();
  h+='<div class="card"><h3>Por comercial</h3>'+(nc.length?'<div class="tw"><table><thead><tr><th>Comercial</th><th>Orçamentos precificados</th><th>Tempo médio p/ colocar preço</th></tr></thead><tbody>'
    +nc.map(function(n){return'<tr><td><b>'+esc(n)+'</b></td><td>'+coms[n].length+'</td><td>'+fmtDur(media(coms[n]))+'</td></tr>';}).join('')
    +'</tbody></table></div>':'<div class="sub">Ainda sem orçamentos precificados no período.</div>')+'</div>';
  /* Paradas */
  h+='<div class="card"><h3>OS paradas há mais tempo que o normal</h3>'+(paradas.length?'<div class="tw"><table><thead><tr><th>OS</th><th>Cliente</th><th>Etapa</th><th>Há</th></tr></thead><tbody>'
    +paradas.map(function(o){return'<tr style="cursor:pointer" onclick="abrirOS(\''+o.id+'\')"><td><b>'+esc(o.numero||'-')+'</b></td><td>'+esc(o.cliente&&o.cliente.nome||'-')+'</td><td>'+etapaBadge(o.etapa)+'</td><td class="late">'+fmtDur(desdeEtapa(o))+'</td></tr>';}).join('')
    +'</tbody></table></div>':'<div class="sub">Nenhuma. 👍</div>')
    +'<div class="hint">Limites: '+Object.keys(ALERTA_H).map(function(k){return ET[k].l+' '+ALERTA_H[k]+'h';}).join(' · ')+'</div></div>';
  /* Lista por OS */
  var med=per.filter(function(o){return o.tempos.orcIni;});
  h+='<div class="card"><h3>Tempos por OS</h3>'+(med.length?'<div class="tw"><table><thead><tr><th>OS</th><th>Entrada</th>'+TRECHOS.map(function(x){return'<th>'+esc(x.l)+'</th>';}).join('')+'</tr></thead><tbody>'
    +med.map(function(o){var d=duracoes(o);return'<tr style="cursor:pointer" onclick="abrirOS(\''+o.id+'\')"><td><b>'+esc(o.numero||'-')+'</b></td><td>'+fmtDH(o.tempos.recebido)+'</td>'+TRECHOS.map(function(x){return'<td>'+fmtDur(d[x.k])+'</td>';}).join('')+'</tr>';}).join('')
    +'</tbody></table></div>':'<div class="sub">Nenhuma OS com orçamento iniciado no período.</div>')+'</div>';
  return h;
}

/* ═══ Técnicos ═══════════════════════════════════════════════════════════ */
function vTecnicos(){
  var h='<div class="ph"><div><h2>Técnicos</h2><p class="sub">Aparecem na lista ao iniciar orçamento e serviço.</p></div></div>';
  h+='<div class="card"><div style="display:flex;gap:8px;"><input class="search" style="margin:0" id="tec-nome" placeholder="Nome do técnico"/><button class="btn btn-p" onclick="addTec()">Adicionar</button></div></div>';
  if(!S.tec.length)h+='<div class="empty">Nenhum técnico cadastrado.</div>';
  S.tec.forEach(function(t){
    h+='<div class="card" style="display:flex;align-items:center;justify-content:space-between;"><b>'+esc(t.nome)+'</b><button class="btn btn-g btn-sm" onclick="rmTec(\''+t.id+'\')">Remover</button></div>';
  });
  return h;
}
async function addTec(){
  var n=val('tec-nome');if(!n)return;
  if(S.tec.some(function(t){return t.nome.toLowerCase()===n.toLowerCase();})){toast('Já cadastrado');return;}
  try{await db.collection(C_TEC).add({nome:n,criadoEm:Date.now()});toast('Técnico adicionado');}catch(e){alert('Erro: '+e.message);}
}
async function rmTec(id){
  var t=S.tec.filter(function(x){return x.id===id;})[0];
  if(!t||!confirm('Remover '+t.nome+' da lista? As OS antigas continuam com o nome dele.'))return;
  try{await db.collection(C_TEC).doc(id).delete();}catch(e){alert('Erro: '+e.message);}
}

/* ═══ Início ═════════════════════════════════════════════════════════════ */
function netStatus(){$('net').textContent=navigator.onLine?'':'⚠ sem internet';}
window.addEventListener('online',netStatus);window.addEventListener('offline',netStatus);
/* Atualiza os "há X min" a cada minuto sem mexer em formulário aberto. */
setInterval(function(){if(!$('modal').innerHTML&&document.activeElement!==$('busca'))render();},60000);
if(initFirebase())listen();
netStatus();render();
</script>
